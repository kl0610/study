<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Applying Properties of Matter — Chapter 2</title>
<style>
:root{
  --bg:#07191D; --panel:#F4F1E9; --panel2:#E6E9E6; --ink:#12211F; --dim:#68787A;
  --cyan:#2E9BB4; --teal:#2F8F76; --amber:#DFA23C; --red:#C4553F; --violet:#7C6BB8;
  --line:#D3D8D4;
  --disp:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--panel);font-family:var(--body);
  line-height:1.55;padding:0 0 40px;
  background-image:radial-gradient(circle at 12% -6%,#0E2E35 0%,transparent 55%)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.hublink{display:inline-block;margin:16px 0 0;font:700 12px var(--mono);
  letter-spacing:.07em;color:var(--cyan);text-decoration:none}
.hublink:hover{text-decoration:underline}
.eyebrow{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#6E8A8E}
h1{font-family:var(--disp);font-size:clamp(27px,7vw,40px);line-height:1.05;
  margin:8px 0 10px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--cyan)}
.bigq{background:#0E2A30;border-left:5px solid var(--cyan);padding:12px 15px;
  font-size:14.5px;margin:0 0 20px}
.bigq b{display:block;font:700 11px var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--cyan);margin-bottom:3px}

.grid{display:grid;gap:11px;margin-bottom:22px}
.set{position:relative;background:var(--panel);color:var(--ink);border:none;
  border-left:6px solid var(--c);padding:15px 17px;text-align:left;cursor:pointer;
  display:block;width:100%;font-family:inherit}
.set:hover{background:#FBF9F3}
.set .tag{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.set h3{font-family:var(--disp);font-size:19px;margin:3px 0 4px;font-weight:750}
.set p{margin:0;font-size:13.5px;color:#47534F}
.set .go{display:inline-block;margin-top:8px;font:800 11px var(--mono);
  letter-spacing:.08em;color:var(--c)}
.badge{position:absolute;right:14px;top:12px;font:700 11px var(--mono);
  background:var(--teal);color:#fff;padding:3px 8px}

.card{background:var(--panel);color:var(--ink);padding:18px 17px 16px;margin-bottom:14px}
.qnum{font:700 10.5px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.q{font-family:var(--disp);font-size:19.5px;font-weight:750;line-height:1.3;margin:5px 0 14px}
.opts{display:grid;gap:8px}
.opt{background:var(--panel2);border:2px solid transparent;padding:12px 14px;
  text-align:left;font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;
  display:flex;gap:11px;align-items:flex-start;min-height:46px}
.opt:hover{border-color:#9BA8A4}
.opt.sel{border-color:var(--cyan);background:#D8ECF1}
.opt.right{border-color:var(--teal);background:#DCEFE7}
.opt.wrong{border-color:var(--red);background:#F6E0DB}
.opt .k{flex:none;width:22px;height:22px;background:#fff;color:var(--dim);
  font:800 11px var(--mono);display:grid;place-items:center;margin-top:1px}

/* the lab bench — evidence the student reasons from */
.bench{background:#0E2A30;color:var(--panel);padding:13px 14px;margin:0 0 14px}
.bench .lead{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:8px}
.bench table{width:100%;border-collapse:collapse;font-size:13.5px}
.bench th{text-align:left;font:700 10.5px var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:#7FA3A8;padding:0 8px 6px 0;border-bottom:1px solid #1C4249}
.bench td{padding:7px 8px 7px 0;border-bottom:1px solid #143238;vertical-align:top}
.bench td:first-child{font:700 13px var(--mono);color:var(--amber);white-space:nowrap}
.bench tr:last-child td{border-bottom:none}

.rows{display:grid;gap:8px}
.row{background:var(--panel2);padding:11px 13px;display:flex;gap:11px;align-items:center;
  font-size:14.5px;min-height:48px}
.row .n{flex:none;width:26px;height:26px;background:var(--cyan);color:#062229;
  font:800 12px var(--mono);display:grid;place-items:center}
.row.right{background:#DCEFE7} .row.wrong{background:#F6E0DB}
.row .mv{margin-left:auto;display:flex;gap:4px}
.row .mv button{width:34px;height:34px;border:2px solid var(--line);background:#fff;
  font:800 14px var(--mono);color:var(--dim);cursor:pointer}
.row .mv button:disabled{opacity:.3;cursor:default}

.tiles{display:grid;gap:8px}
.tile{background:var(--panel2);border:2px solid transparent;padding:12px 14px;
  text-align:left;font-size:14.5px;font-family:inherit;color:var(--ink);cursor:pointer;
  min-height:46px}
.tile.sel{border-color:var(--cyan);background:#D8ECF1}
.tile.right{border-color:var(--teal);background:#DCEFE7}
.tile.wrong{border-color:var(--red);background:#F6E0DB}

.act{display:grid;gap:8px;margin-top:14px}
.btn{padding:13px;font-weight:750;font-size:15px;text-align:center;border:none;
  font-family:inherit;cursor:pointer}
.btn.p{background:var(--teal);color:#fff}
.btn.g{background:var(--cyan);color:#062229}
.btn.o{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.fb{padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.5}
.fb strong{display:block;font-family:var(--disp);font-size:15.5px;margin-bottom:3px}
.fb.yes{background:#DCEFE7;border-left:5px solid var(--teal);color:#17372C}
.fb.no{background:#F6E0DB;border-left:5px solid var(--red);color:#5A2418}
.fb cite{display:block;font:600 11px var(--mono);color:var(--dim);margin-top:6px;font-style:normal}

.dots{display:flex;gap:5px;margin:0 0 12px}
.dot{flex:1;height:5px;background:#173C43}
.dot.done{background:var(--teal)} .dot.now{background:var(--cyan)}

.reveal{background:#0E2A30;color:var(--panel);padding:16px;margin-top:12px}
.reveal .lead{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:6px}
.reveal p{margin:0 0 9px;font-size:14.5px}

.score{background:var(--panel);color:var(--ink);padding:22px 18px;text-align:center}
.ring{font:800 44px var(--disp);line-height:1}
.band{font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:9px;margin:16px 0}
.stat{flex:1;background:var(--panel2);padding:10px}
.stat b{display:block;font:800 19px var(--mono)}
.stat span{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.review{background:var(--panel2);padding:12px 14px;text-align:left;margin-bottom:10px;font-size:13.5px}
.review b{display:block;font-family:var(--disp);font-size:15px;margin-bottom:4px}

footer{margin:26px 0 0;padding-top:15px;border-top:1px solid #173C43;
  color:#5A6E71;font-size:11.5px;line-height:1.6}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!-- MC-THEME-CSS: generated by build_theme.py, do not hand-edit -->
<style>
/* ===== Minecraft theme layer — shared source, injected into all apps =====
   Everything is prefixed .mc- / #mc- so it cannot collide with app CSS.
   z-index budget in the apps: content < 30, HUD 30, scrim 40, drawer 50.
   Sprite bursts sit at 60 so they play over an auto-opening drawer.        */

.mc-hud{
  position:fixed; left:0; right:0; z-index:30;
  bottom:var(--mc-lift, 0px);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  pointer-events:none;
  background:linear-gradient(to top, rgba(0,0,0,.42), rgba(0,0,0,0));
  transition:bottom .18s;
}
.mc-hud img{image-rendering:pixelated; display:block}

.mc-hearts{
  display:flex; gap:1px; align-self:center;
  width:var(--mc-barw, 360px); box-sizing:border-box;
}
.mc-heart{width:var(--mc-hh,19px); height:auto}
/* heart-empty is very faint on dark art — read the row as sockets waiting */
.mc-heart[data-v="0"]{filter:drop-shadow(0 0 2px rgba(255,255,255,.5)) drop-shadow(0 0 5px rgba(0,0,0,.6)); opacity:.85}
.mc-heart.mc-hit{animation:mc-hit .42s}
@keyframes mc-hit{
  0%{transform:scale(1.55)} 25%{transform:scale(1.1) rotate(-8deg)}
  55%{transform:scale(1.25)} 100%{transform:none}
}

.mc-bar{display:flex; gap:0; width:var(--mc-barw,360px); box-sizing:border-box}
.mc-slot{
  position:relative; width:var(--mc-ss,38px); height:var(--mc-ss,38px);
  flex:0 0 auto; background-size:100% 100%; background-repeat:no-repeat;
}
.mc-slot .mc-tool{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:69%; height:69%; object-fit:contain;
}
/* tool-9 already has zero side margin in the source art — don't scale it up */
.mc-slot[data-n="9"] .mc-tool{width:62%; height:62%}
.mc-slot .mc-frame{position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px); opacity:0}
.mc-slot.mc-new .mc-frame{opacity:1; animation:mc-pulse 1.1s ease-in-out 3}
.mc-slot.mc-new .mc-tool{animation:mc-drop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes mc-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes mc-drop{from{transform:translate(-50%,-160%) scale(.4); opacity:0}}

/* ---- sprite burst ---- */
.mc-burst{
  position:fixed; left:50%; top:44%; z-index:60; pointer-events:none;
  width:var(--mc-burst,128px); height:var(--mc-burst,128px);
  transform:translate(-50%,-50%);
}
.mc-burst img{width:100%; height:100%; object-fit:contain; image-rendering:pixelated}
.mc-burst.mc-good{animation:mc-good 1.35s cubic-bezier(.18,1.3,.4,1) forwards}
.mc-burst.mc-bad{animation:mc-bad 1.15s ease-out forwards}
/* bad-2 creeper and bad-4 zombie carry ~30px of side margin; TNT and the
   spider fill the frame. Nudge the narrow two up so misses land evenly. */
.mc-burst.mc-bad[data-w="narrow"] img{transform:scale(1.17)}
@keyframes mc-good{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg); opacity:0}
  18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg); opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1}
  72%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1}
  100%{transform:translate(-50%,-80%) scale(1.05); opacity:0}
}
@keyframes mc-bad{
  0%{transform:translate(-50%,-50%) scale(.55); opacity:0}
  14%{transform:translate(-50%,-50%) scale(1.08); opacity:1}
  26%{transform:translate(-50%,-50%) scale(1); opacity:1}
  74%{transform:translate(-50%,-50%) scale(1); opacity:1}
  100%{transform:translate(-50%,-44%) scale(.96); opacity:0}
}

.mc-shake{animation:mc-shake .34s}
@keyframes mc-shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}

/* ---- results chest ---- */
.mc-chest{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:14px 10px 4px; margin:2px 0 6px;
}
.mc-chest .mc-lid{width:120px; height:120px; object-fit:contain; image-rendering:pixelated;
  transition:transform .2s; cursor:pointer}
.mc-chest .mc-lid.mc-shut{animation:mc-nudge 1.5s ease-in-out infinite}
@keyframes mc-nudge{0%,88%,100%{transform:none}92%{transform:translateY(-4px) rotate(-2deg)}96%{transform:translateY(-2px) rotate(2deg)}}
.mc-loot{display:flex; gap:6px; justify-content:center; min-height:4px; flex-wrap:wrap}
.mc-loot img{width:52px; height:52px; object-fit:contain; image-rendering:pixelated;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.mc-loot img:nth-child(2){animation-delay:.09s}
.mc-loot img:nth-child(3){animation-delay:.18s}
.mc-loot img:nth-child(4){animation-delay:.27s}
.mc-loot img:nth-child(5){animation-delay:.36s}
@keyframes mc-pop{from{transform:translateY(26px) scale(.3); opacity:0}}
.mc-tier{
  font:800 19px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.1em;
  text-align:center; margin-top:2px;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) .3s both;
}
.mc-tier[data-t="dragon"]{color:#A855C8}
.mc-tier[data-t="netherite"]{color:#6B5A6E}
.mc-tier[data-t="diamond"]{color:#2AA7B8}
.mc-tier[data-t="iron"]{color:#8A8A8A}
.mc-tier[data-t="stone"]{color:#7A7A7A}
.mc-tier[data-t="wood"]{color:#9A6B3F}
.mc-tier[data-t="corrections"]{color:#4A8230}
.mc-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.mc-badge{
  font:800 10.5px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.07em;
  background:#F0E6CF; color:#5A4A2E; border:2px solid #C7B48C; padding:4px 8px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.12), inset 2px 2px 0 rgba(255,255,255,.5);
  animation:mc-pop .45s cubic-bezier(.2,1.6,.4,1) both;
}
.mc-badge:nth-child(2){animation-delay:.1s}
.mc-badge:nth-child(3){animation-delay:.2s}
.mc-cap{
  font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em;
  text-transform:uppercase; opacity:.72; text-align:center;
}
.mc-earned{
  display:flex; align-items:center; gap:9px; justify-content:center;
  font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) .45s both;
}
.mc-earned img{width:38px; height:38px; object-fit:contain; image-rendering:pixelated}

.mc-boss{width:100%; max-width:256px; height:auto; image-rendering:pixelated;
  animation:mc-pop .6s cubic-bezier(.2,1.5,.4,1) .3s both}
/* fallback while boss-defeated.png is still outstanding */
.mc-bossfall{
  width:100%; max-width:280px; border-radius:12px; padding:13px 14px; text-align:center;
  background:linear-gradient(140deg,#1D1526,#3A1F2E); color:#FFD98A;
  border:2px solid #6B4A2E; box-shadow:0 6px 0 rgba(0,0,0,.25);
  font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.05em;
  animation:mc-pop .6s cubic-bezier(.2,1.5,.4,1) .3s both;
}
.mc-bossfall small{display:block; font-size:11px; opacity:.7; margin-top:4px; letter-spacing:.03em}

@media (prefers-reduced-motion:reduce){
  .mc-burst.mc-good,.mc-burst.mc-bad{animation-duration:.8s}
  .mc-shake{animation:none}
  .mc-chest .mc-lid.mc-shut{animation:none}
}

/* ---- level-picker status ----
   The apps' own .badge sat in the bottom-right corner of a tall card, so
   checking seven levels meant scanning seven different corners. Moved to the
   top-right, level with each card's eyebrow, which gives one straight vertical
   line to run your eye down. These sit later in the cascade at equal
   specificity, so they win without editing app CSS. */
.mc-best{
  top:11px !important; right:12px !important; bottom:auto !important;
  background:#E8A93C !important; color:#3A2A08 !important;
  font-weight:800 !important; letter-spacing:.04em; white-space:nowrap;
  padding:4px 9px !important; border-radius:3px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.16), inset 2px 2px 0 rgba(255,255,255,.35);
}
.mc-best.mc-done{background:#63A93E !important; color:#0F2216 !important}
/* and mark the card itself, so status is legible even mid-scroll */
.mc-cleared{box-shadow:inset 0 0 0 3px #63A93E !important}
.mc-tried{box-shadow:inset 0 0 0 3px #E8A93C !important}

/* ---- level chips (MC.picker) ----
   For apps whose levels are parallel and equally valid — history's five
   practice sets — so you can see and choose, not just be dealt one. */
.mc-picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.mc-chip{
  flex:1 1 auto; min-width:56px; min-height:44px; padding:5px 8px;
  border:2px solid #C7B48C; background:#F0E6CF; color:#5A4A2E; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.14), inset 2px 2px 0 rgba(255,255,255,.5);
}
.mc-chip:hover{filter:brightness(1.05)}
.mc-chip:focus-visible{outline:3px solid #63A93E;outline-offset:2px}
.mc-chip-l{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.mc-chip-s{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.7}
.mc-chip.mc-cleared{background:#63A93E;border-color:#3F7028;color:#0F2216}
.mc-chip.mc-tried{background:#E8A93C;border-color:#B07E18;color:#3A2A08}
.mc-chip.mc-now{box-shadow:inset -2px -2px 0 rgba(0,0,0,.14),
  inset 2px 2px 0 rgba(255,255,255,.5), 0 0 0 3px #2B79C2}

/* ---------- the mine ---------- */
.mc-ore{display:inline-flex;align-items:center;gap:5px;margin:3px 5px 3px 0;
  font:800 11px ui-monospace,"SF Mono",Consolas,monospace;color:#E8E3D6}
.mc-ore img{width:22px;height:22px;image-rendering:pixelated;display:block}
.mc-ore.mc-noart::before{content:"";width:20px;height:20px;background:var(--ore);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.34), inset 3px 3px 0 rgba(255,255,255,.22);
  border:2px solid rgba(0,0,0,.45)}
.mc-ore b{font-weight:800}
.mc-ore.mc-dim{opacity:.42}
.mc-haul,.mc-beacon{margin-top:10px;padding:9px 11px;background:rgba(0,0,0,.26);
  border:2px solid rgba(255,255,255,.10);text-align:left}
.mc-haullab{display:block;font:800 9.5px ui-monospace,Consolas,monospace;
  letter-spacing:.14em;color:#9FB0AA;margin-bottom:5px}
.mc-beacon small,.mc-shutportal small{display:block;margin-top:6px;
  font:600 11px system-ui,sans-serif;color:#9FB0AA;line-height:1.45}
.mc-beacon.mc-lit{border-color:#40D5D1;
  box-shadow:0 0 0 2px rgba(64,213,209,.22), 0 0 22px rgba(64,213,209,.28)}
.mc-shutportal{margin-top:10px;padding:10px 12px;background:#160E22;
  border:2px solid #4B2E73;color:#C9A6F0;text-align:left;
  font:800 11.5px ui-monospace,Consolas,monospace;letter-spacing:.1em}

.mc-blk{display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  margin:4px 9px 2px 0;font:800 10px ui-monospace,Consolas,monospace;color:#C4CFCB}
.mc-blk img{width:34px;height:34px;image-rendering:pixelated;display:block}
.mc-blk.mc-noart::before{content:"";width:30px;height:30px;background:var(--ore);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.34),inset 4px 4px 0 rgba(255,255,255,.22);
  border:2px solid rgba(0,0,0,.45)}
.mc-blk.mc-dim img{filter:grayscale(.15) brightness(.8)}
.mc-blk.mc-dim{opacity:.75;color:#7C8A85}
.mc-portal{float:right;width:46px;height:46px;margin:-2px 0 0 10px;image-rendering:pixelated;
  filter:grayscale(1) brightness(.6)}
.mc-egg{margin-top:10px;padding:8px 11px;background:rgba(0,0,0,.26);
  border:2px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:9px;
  font:800 10.5px ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#C9A6F0}
.mc-egg img{width:30px;height:30px;image-rendering:pixelated}
</style>
<!-- /MC-THEME-CSS -->

<script>window.__MC_PREFIX__="../../assets/";

<script>/* ===== Minecraft theme layer — shared source =====
   Built once, injected into every app. Do not edit inside an app's
   index.html; edit theme/mc.js and rebuild, or the four copies drift.

   Contract:
     MC.config({app, shake, lift, dragon})  once, before anything else
     MC.begin(id)                           entering a level — refills hearts
     MC.right()                             a correct answer
     MC.wrong(missKey)                      a wrong answer — costs half a heart
     MC.note(missKey)                       record a miss without spending one
     MC.credit(missKey)                     count a fix without a burst
     MC.clear(id, pct, {boss})              level finished — may award a tool
     MC.chest(el, pct, {id})                paint the results reveal into el
     MC.bests()                             {id: bestPct} for this app
     MC.picker(el, items, cur, onPick)       a strip of level chips
     MC.state()                             read-only snapshot (used by the hub)

   No death, no game over. Hearts only shrink the loot. A kid who is stuck
   must never hit a wall — see HANDOFF.
*/
(function () {
  "use strict";

  var PREFIX = window.__MC_PREFIX__ || "../../assets/";
  var INLINE = window.__MC_INLINE__ || null;
  var HAS_BOSS = window.__MC_HAS_BOSS__ === true;
  var url = function (n) { return INLINE ? (INLINE[n] || "") : PREFIX + n + ".png"; };

  /* ---------- persistence (shared origin, so shared across all four apps) ---------- */
  var KEY = "mc.study.v1";
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
  if (!S.cleared || typeof S.cleared !== "object") S.cleared = {};
  if (!S.misses || typeof S.misses !== "object") S.misses = {};
  if (typeof S.tool9 !== "boolean") S.tool9 = false;
  if (!S.ore || typeof S.ore !== "object") S.ore = {};
  if (!S.gem || typeof S.gem !== "object") S.gem = {};   // "app:id" -> diamond taken
  if (typeof S.dragon !== "number") S.dragon = 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var TOOLS = ["wooden pickaxe", "stone pickaxe", "iron pickaxe", "diamond pickaxe",
               "sword", "torch", "shield", "bow", "elytra"];

  /* Tools 1-8 come from how many activities have been cleared anywhere on the
     site at 75%+. Tool 9, the elytra, only ever comes from spelling Challenge 2 —
     the one level where he writes his own sentences. */
  /* ---------- the mine ----------
     The tool bar was the whole ladder, and with twenty-odd activities on the
     site he fills it long before he runs out of work. So the tools are only
     the first age. Once all nine are held the mine opens, and from then on
     what a run is worth depends on how well it went rather than on whether it
     was new. Coal through gold are repeatable, so there is always something to
     dig; diamond is once per activity, so the only way to a pile of them is
     breadth AND mastery; emerald comes from the dragon alone. */
  var ORE = [
    { k: "coal",     name: "coal",     hex: "#2C2C30" },
    { k: "copper",   name: "copper",   hex: "#C1663F" },
    { k: "iron",     name: "iron",     hex: "#C6C2BC" },
    { k: "gold",     name: "gold",     hex: "#E4C04A" },
    { k: "redstone", name: "redstone", hex: "#B4262A" },
    { k: "lapis",    name: "lapis",    hex: "#2A5CB4" },
    { k: "diamond",  name: "diamond",  hex: "#40D5D1" },
    { k: "emerald",  name: "emerald",  hex: "#2FA84F" }
  ];
  var ORE_BY = {};
  for (var _o = 0; _o < ORE.length; _o++) ORE_BY[ORE[_o].k] = ORE[_o];

  /* A beacon is built from the four block types Minecraft actually accepts.
     Nine of a mineral makes a block. */
  var BEACON = ["iron", "gold", "diamond", "emerald"];

  function oreCount(k) { return S.ore[k] || 0; }
  function blocks(k) { return Math.floor(oreCount(k) / 9); }
  function beaconLit() {
    for (var i = 0; i < BEACON.length; i++) if (blocks(BEACON[i]) < 1) return false;
    return true;
  }

  function clearedCount() {
    var n = 0, k;
    for (k in S.cleared) if (S.cleared[k] >= 75) n++;
    return n;
  }
  function unlocked() {
    var n = Math.min(8, clearedCount());
    return { count: n, nine: !!S.tool9, all9: n >= 8 && !!S.tool9 };
  }
  function mineOpen() { return unlocked().all9; }
  function has(slot) { var u = unlocked(); return slot === 9 ? u.nine : slot <= u.count; }

  /* ---------- state ---------- */
  var cfg = { app: "app", shake: null, lift: null, burst: 320, hud: true,
              /* Which activities can summon the dragon. null = any level in this
                 app. An array restricts it to those ids — spelling passes ["l7"]
                 so only Challenge 2, the hardest level of whatever week's list
                 is loaded, can wake it. */
              dragon: null };
  var halves = 20;          // 10 hearts, tracked in halves
  var missedHere = {};      // keys missed during this level
  var fixedHere = 0;        // ...and later got right — the comeback count
  var partialRun = false;   // a correction round over just the missed items
  var hud, heartsEl, barEl, lastNew = 0;
  var goodN = 0, badN = 0;  // cycle the sprites so it isn't the same one every time

  /* ---------- HUD ---------- */
  function build() {
    if (hud || cfg.hud === false) return;
    hud = document.createElement("div");
    hud.className = "mc-hud";
    hud.id = "mc-hud";
    hud.innerHTML = '<div class="mc-hearts" id="mc-hearts"></div>' +
                    '<div class="mc-bar" id="mc-bar"></div>';
    document.body.appendChild(hud);
    heartsEl = hud.querySelector("#mc-hearts");
    barEl = hud.querySelector("#mc-bar");
    drawBar();
    drawHearts();
    fit();
    window.addEventListener("resize", fit);
    // the app's own bar can grow when feedback appears — ride above it
    if (cfg.lift && window.ResizeObserver) {
      var t = document.querySelector(cfg.lift);
      if (t) new ResizeObserver(function () { lift(); }).observe(t);
    }
    // the HUD is appended before the rest of the page parses, so its height
    // is not final yet; re-measure once the document is up
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", fit);
    else setTimeout(fit, 0);
    window.addEventListener("orientationchange", function () { setTimeout(fit, 120); });
  }

  /* The hotbar must never wrap and must never overflow. Size the slot from the
     viewport and let the hearts follow it. Checked 300-1024px. */
  function fit() {
    if (!hud) return;
    var vw = Math.max(280, document.documentElement.clientWidth || window.innerWidth);
    var vh = Math.max(320, document.documentElement.clientHeight || window.innerHeight);
    var bsz = Math.max(150, Math.min(cfg.burst, Math.round(vw * 0.55), Math.round(vh * 0.42)));
    var avail = Math.min(430, vw - 16);
    var ss = Math.max(24, Math.min(46, Math.floor(avail / 9)));
    var barw = ss * 9;
    hud.style.setProperty("--mc-ss", ss + "px");
    hud.style.setProperty("--mc-barw", barw + "px");
    hud.style.setProperty("--mc-hh", Math.max(13, Math.round(ss * 0.5)) + "px");
    hud.style.setProperty("--mc-burst", bsz + "px");
    document.documentElement.style.setProperty("--mc-burst", bsz + "px");
    lift();
    // keep app content clear of the HUD
    var h = hud.offsetHeight || 70;
    document.body.style.paddingBottom = (h + (cfg._liftpx || 0) + 10) + "px";
  }

  /* Only the vocabulary app has a persistent fixed bar of its own, and it grows
     when feedback appears. Ride above whatever height it currently is. */
  function lift() {
    if (!cfg.lift || !hud) return;
    var t = document.querySelector(cfg.lift);
    var px = (t && t.offsetParent !== null) ? t.offsetHeight : 0;
    cfg._liftpx = px;
    hud.style.setProperty("--mc-lift", px + "px");
  }

  function drawHearts() {
    if (!heartsEl) return;
    var out = "", i, v;
    for (i = 0; i < 10; i++) {
      v = Math.max(0, Math.min(2, halves - i * 2));
      out += '<img class="mc-heart" data-v="' + v + '" alt="" src="' +
             url(v === 2 ? "heart-full" : v === 1 ? "heart-half" : "heart-empty") + '">';
    }
    heartsEl.innerHTML = out;
  }

  /* Renders a mineral. The coloured block is CSS, so this works before any
     ore art exists; if the sprite is there it loads on top, and if it is not
     the broken image removes itself rather than showing a torn-page icon. */
  function oreChip(k, label, on) {
    var o = ORE_BY[k];
    return '<span class="mc-ore' + (on === false ? " mc-dim" : "") + '" title="' + o.name +
           '" style="--ore:' + o.hex + '">' +
           '<img alt="" src="' + url("ore-" + k) +
           '" onerror="this.parentNode.classList.add(\'mc-noart\');this.remove()">' +
           (label ? '<b>' + label + "</b>" : "") + "</span>";
  }

  /* A beacon slot. Earned slots show their block; an unearned one shows the
     plain stone stand-in, so the row reads as a pyramid under construction
     rather than as four mystery squares. Either falls back to a CSS block. */
  function blockChip(b) {
    var got = b.blocks >= 1;
    return '<span class="mc-blk' + (got ? "" : " mc-dim") + '" title="' + b.name +
           '" style="--ore:' + b.hex + '">' +
           '<img alt="" src="' + url(got ? "block-" + b.k : "block-locked") +
           '" onerror="this.parentNode.classList.add(\'mc-noart\');this.remove()">' +
           "<b>" + b.blocks + "/1</b></span>";
  }

  function drawBar() {
    if (!barEl) return;
    var out = "", i, on;
    for (i = 1; i <= 9; i++) {
      on = has(i);
      out += '<div class="mc-slot' + (i === lastNew ? " mc-new" : "") + '" data-n="' + i +
             '" style="background-image:url(' + url("slot") + ')" title="' +
             (on ? TOOLS[i - 1] : "locked") + '">' +
             '<img class="mc-frame" alt="" src="' + url("slot-frame") + '">' +
             (on ? '<img class="mc-tool" alt="' + TOOLS[i - 1] + '" src="' + url("tool-" + i) + '">' : "") +
             "</div>";
    }
    barEl.innerHTML = out;
  }

  /* ---------- sprite bursts ---------- */
  function burst(name, cls, narrow) {
    var old = document.querySelector(".mc-burst");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var d = document.createElement("div");
    d.className = "mc-burst " + cls;
    if (narrow) d.setAttribute("data-w", "narrow");
    d.innerHTML = '<img alt="" src="' + url(name) + '">';
    document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1600);
  }

  function shake() {
    if (!cfg.shake) return;                 // science already shakes its own card
    var t = document.querySelector(cfg.shake);
    if (!t) return;
    t.classList.remove("mc-shake");
    void t.offsetWidth;
    t.classList.add("mc-shake");
    setTimeout(function () { t.classList.remove("mc-shake"); }, 400);
  }

  /* ---------- public ---------- */
  var MC = {
    config: function (o) {
      for (var k in o) if (o.hasOwnProperty(k)) cfg[k] = o[k];
      if (document.body) build(); else
        document.addEventListener("DOMContentLoaded", build);
      return MC;
    },

    /* Entering a level. Pass {partial:true} for a correction round that
       replays only the missed items — those must not overwrite a best score
       or hand out the big rewards, since three words at 100% is not the same
       achievement as twelve. */
    begin: function (opts) {
      halves = 20; lastNew = 0;
      missedHere = {}; fixedHere = 0;
      partialRun = !!(opts && opts.partial);
      build(); drawHearts(); drawBar(); fit();
    },

    /* Credit a fix without any fanfare. The vocabulary sheet settles 26 words
       on a single check — that is one burst, not twenty-six. */
    credit: function (missKey) {
      if (missKey && missedHere[missKey]) { fixedHere++; delete missedHere[missKey]; }
    },

    /* Pass the same key you passed to wrong()/note() and the correction is
       counted — that is what earns the comeback badge. */
    right: function (missKey) {
      build();
      MC.credit(missKey);
      goodN = goodN % 4 + 1;
      burst("win-" + goodN, "mc-good");
    },

    /* Record a miss without any cost. Used where one action covers several
       items, or where the answer is revealed after the miss already landed. */
    note: function (missKey) {
      if (!missKey) return;
      missedHere[missKey] = true;
      var a = cfg.app;
      if (!S.misses[a]) S.misses[a] = {};
      S.misses[a][missKey] = (S.misses[a][missKey] || 0) + 1;
      save();
    },

    wrong: function (missKey) {
      build();
      badN = badN % 4 + 1;
      burst("bad-" + badN, "mc-bad", badN === 2 || badN === 4);
      shake();
      if (halves > 0) {
        halves--;                            // floors at zero — never a game over
        drawHearts();
        var i = Math.floor(halves / 2);
        var h = heartsEl && heartsEl.children[Math.min(9, i)];
        if (h) h.classList.add("mc-hit");
      }
      MC.note(missKey);
    },

    /* Records the score, may award a tool. Returns what happened so the
       results screen can talk about it. */
    /* Records the score, may award a tool, and works out what he earned.
       Every band is a real Minecraft tier, because every one of them is a
       tool you are glad to have — there is no booby prize here. */
    clear: function (id, pct, opts) {
      opts = opts || {};
      pct = Math.round(pct);
      var key = cfg.app + ":" + id;
      var prev = S.cleared[key];
      var before = unlocked();
      var got = null;

      if (!partialRun) {
        S.cleared[key] = Math.max(prev || 0, pct);
        if (key === "spelling:l7" && pct >= 75) S.tool9 = true;
        save();
        var after = unlocked();
        if (after.nine && !before.nine) got = 9;
        else if (after.count > before.count) got = after.count;
        lastNew = got || 0;
        drawBar();
      }

      var clean = pct >= 100 && halves === 20;
      var isBossLevel = cfg.dragon === null || cfg.dragon.indexOf(id) !== -1;
      /* The End portal stays shut until the whole tool set is his. A perfect
         run before that is still a perfect run — it just does not summon a
         dragon, and the chest says what is still missing rather than going
         quiet about it. */
      var ready = unlocked().all9;
      var dragon = clean && !partialRun && isBossLevel && ready;
      var portalShut = clean && !partialRun && isBossLevel && !ready;
      if (dragon) { S.dragon++; save(); }

      /* What the run was worth at the rock face. Coal through gold repeat, so
         there is always something to dig; diamond is once per activity, so a
         pile of them needs breadth AND mastery; emerald comes only from the
         dragon. Nothing is mined at all until the tool set is complete. */
      var mined = [];
      function dig(k, n) {
        S.ore[k] = (S.ore[k] || 0) + n;
        mined.push({ k: k, n: n, name: ORE_BY[k].name, hex: ORE_BY[k].hex });
      }
      if (mineOpen()) {
        if (partialRun) {
          if (pct >= 100) dig("lapis", 1);            // every miss put right
        } else {
          if (pct >= 75) dig("coal", 1);
          if (pct >= 85) dig("copper", 1);
          if (pct >= 95) dig("iron", 1);
          if (pct >= 100) dig("gold", 1);
          if (pct >= 75 && halves === 20) dig("redstone", 1);
          if (clean && !S.gem[key]) { S.gem[key] = true; dig("diamond", 1); }
        }
        if (dragon) dig("emerald", 1);
        if (mined.length) save();
      }

      var tier;
      if (partialRun)   tier = ["CORRECTIONS", "You went back and fixed them. That is the part that sticks."];
      else if (dragon)  tier = ["DRAGON SLAIN", "Perfect. Not one miss, not one heart."];
      else if (clean)   tier = ["NETHERITE", "Every single one right."];
      else if (pct >= 90) tier = ["DIAMOND", "So close to flawless."];
      else if (pct >= 75) tier = ["IRON", "Solid work \u2014 this one is holding."];
      else if (pct >= 50) tier = ["STONE", "You got through it. Now you know where to dig."];
      else                tier = ["WOOD", "You finished it, and that is where everyone starts."];

      /* Badges stack. They reward things accuracy alone does not see. */
      var badges = [];
      if (fixedHere)
        badges.push(fixedHere === 1 ? "TURNED ONE AROUND" : "TURNED " + fixedHere + " AROUND");
      if (!partialRun && prev != null && pct > prev)
        badges.push("NEW BEST \u2014 BEAT " + prev + "%");
      if (!partialRun && (prev == null || prev < 75) && pct >= 75)
        badges.push("FIRST CLEAR");
      if (halves > 0 && halves <= 4 && pct >= 50)
        badges.push("STUCK IT OUT");

      var bea = null;
      if (mineOpen()) {
        bea = { lit: beaconLit(), need: [] };
        for (var bi = 0; bi < BEACON.length; bi++)
          bea.need.push({ k: BEACON[bi], have: oreCount(BEACON[bi]),
                          blocks: blocks(BEACON[bi]), name: ORE_BY[BEACON[bi]].name,
                          hex: ORE_BY[BEACON[bi]].hex });
      }

      return {
        mined: mined, beacon: bea, portalShut: portalShut,
        toolsLeft: (8 - unlocked().count) + (S.tool9 ? 0 : 1),
        mineOpen: mineOpen(), dragons: S.dragon,
        tool: got,
        toolName: got ? TOOLS[got - 1] : null,
        loot: halves >= 20 ? 4 : halves >= 15 ? 3 : halves >= 8 ? 2 : 1,
        hearts: halves / 2,
        fixed: fixedHere,
        partial: partialRun,
        tier: tier[0], blurb: tier[1], badges: badges,
        boss: dragon
      };
    },

    /* Paints chest-closed, then opens it on tap or after a beat. */
    chest: function (host, pct, opts) {
      if (!host) return null;
      var r = MC.clear(opts.id, pct, opts);
      var box = document.createElement("div");
      box.className = "mc-chest";
      box.innerHTML = '<img class="mc-lid mc-shut" alt="Closed chest" src="' + url("chest-closed") + '">' +
                      '<div class="mc-loot"></div>' +
                      '<div class="mc-tier"></div>' +
                      '<div class="mc-cap">Tap the chest</div>';
      host.insertBefore(box, host.firstChild);
      var lid = box.querySelector(".mc-lid"),
          loot = box.querySelector(".mc-loot"),
          tierEl = box.querySelector(".mc-tier"),
          cap = box.querySelector(".mc-cap"),
          opened = false;

      function open() {
        if (opened) return;
        opened = true;
        lid.classList.remove("mc-shut");
        lid.src = url("chest-open");
        lid.alt = "Open chest";
        lid.style.cursor = "default";
        var html = "", i;
        for (i = 1; i <= r.loot; i++) html += '<img alt="" src="' + url("win-" + i) + '">';
        loot.innerHTML = html;
        tierEl.textContent = r.tier;
        tierEl.setAttribute("data-t", r.tier.split(" ")[0].toLowerCase());
        cap.textContent = r.blurb;
        if (r.badges.length) {
          box.insertAdjacentHTML("beforeend", '<div class="mc-badges">' +
            r.badges.map(function (b) { return '<span class="mc-badge">' + b + "</span>"; })
              .join("") + "</div>");
        }
        if (r.tool) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-earned"><img alt="" src="' + url("tool-" + r.tool) + '">' +
            "<span>NEW &middot; " + r.toolName.toUpperCase() + "</span></div>");
        }
        if (r.mined && r.mined.length) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-haul"><span class="mc-haullab">MINED</span>' +
            r.mined.map(function (m) { return oreChip(m.k, "+" + m.n); }).join("") +
            "</div>");
        }
        if (r.portalShut) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-shutportal"><img class="mc-portal" alt="" src="' + url("portal") +
            '" onerror="this.remove()">THE PORTAL WILL NOT OPEN<small>A perfect run \u2014 ' +
            'but the End stays shut until all nine tools are yours. ' +
            (r.toolsLeft === 1 ? "One to go." : r.toolsLeft + " to go.") + "</small></div>");
        }
        if (r.beacon) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-beacon' + (r.beacon.lit ? " mc-lit" : "") + '">' +
            '<span class="mc-haullab">' + (r.beacon.lit ? "BEACON LIT" : "BEACON") + "</span>" +
            r.beacon.need.map(function (b) { return blockChip(b); }).join("") +
            "<small>" + (r.beacon.lit
              ? "Iron, gold, diamond and emerald, a block of each. That is the whole pyramid."
              : "Nine of a mineral makes a block. Four blocks light the beacon.") +
            "</small></div>");
        }
        if (!r.boss && r.dragons > 0 && r.mineOpen) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-egg"><img alt="" src="' + url("dragon-egg") +
            '" onerror="this.remove()"><span>' +
            (r.dragons === 1 ? "One dragon down" : r.dragons + " dragons down") +
            "</span></div>");
        }
        if (r.boss) {
          box.insertAdjacentHTML("beforeend", HAS_BOSS
            ? '<img class="mc-boss" alt="Ender dragon defeated" src="' + url("boss-defeated") + '">'
            : '<div class="mc-bossfall">DRAGON SLAIN<small>Perfect run \u2014 no misses, no hearts lost</small></div>');
        }
      }
      lid.addEventListener("click", open);
      setTimeout(open, 2600);                // opens itself if he doesn't tap
      return r;
    },

    /* Best score per activity for THIS app, keyed by bare id — lets an app's
       level picker show scores that survive a reload. The apps each kept their
       own in-memory `best` object, which forgot everything on refresh. */
    bests: function () {
      var out = {}, pre = cfg.app + ":", k;
      for (k in S.cleared) if (k.indexOf(pre) === 0) out[k.slice(pre.length)] = S.cleared[k];
      return out;
    },

    /* A strip of level chips, each showing whether it has been cleared.
       Reusable: any app with several parallel levels calls this rather than
       rolling its own, so history, and anything added later, look the same.

         MC.picker(hostEl, [{id:"set0", label:"1"}, ...], currentId, onPick)

       Chips colour themselves from MC.bests(): green cleared, amber attempted,
       plain untouched. Re-call it to repaint after a score changes. */
    picker: function (host, items, current, onPick) {
      if (!host) return;
      var best = MC.bests();
      host.className = "mc-picker";
      host.innerHTML = items.map(function (it) {
        var b = best[it.id];
        var cls = b == null ? "" : (b >= 75 ? " mc-cleared" : " mc-tried");
        if (it.id === current) cls += " mc-now";
        return '<button type="button" class="mc-chip' + cls + '" data-id="' + it.id +
               '" aria-pressed="' + (it.id === current) + '"' +
               ' title="' + (b == null ? "not tried yet" : "best " + b + "%") + '">' +
               '<span class="mc-chip-l">' + it.label + "</span>" +
               '<span class="mc-chip-s">' + (b == null ? "&mdash;" : b + "%") + "</span>" +
               "</button>";
      }).join("");
      var bs = host.querySelectorAll(".mc-chip");
      for (var i = 0; i < bs.length; i++) {
        bs[i].addEventListener("click", function () {
          onPick(this.getAttribute("data-id"));
        });
      }
    },

    state: function () {
      var u = unlocked();
      return {
        tools: u, toolNames: TOOLS,
        ore: JSON.parse(JSON.stringify(S.ore)), oreKinds: ORE,
        mineOpen: mineOpen(), dragons: S.dragon,
        beacon: { needs: BEACON, lit: beaconLit(),
                  blocks: BEACON.map(function (k) { return blocks(k); }) },
        cleared: JSON.parse(JSON.stringify(S.cleared)),
        misses: JSON.parse(JSON.stringify(S.misses)),
        url: url
      };
    },

    reset: function () {
      S = { cleared: {}, misses: {}, tool9: false, ore: {}, gem: {}, dragon: 0 };
      save(); drawBar();
    },
    _relift: lift
  };

  window.MC = MC;
})();
</script>
<script>MC.config({"app": "science2", "shake": "#card", "lift": null, "dragon": ["m4"]});</script>
<!-- /MC-THEME-JS -->

<div class="wrap">
  <a class="hublink" href="../../">&lsaquo; All subjects</a>

  <div id="home">
    <p class="eyebrow">CKSci Grade 5 · Investigating Matter · Chapter 2 · Teacher Guide Lesson 3</p>
    <h1>Applying Properties <em>of Matter</em></h1>
    <div class="bigq"><b>The Big Question</b>
      How can I use properties as evidence to identify matter?</div>
    <div class="grid" id="sets"></div>
    <footer id="foot"></footer>
  </div>

  <div id="play" class="hide">
    <p class="eyebrow" id="sname"></p>
    <div class="dots" id="dots"></div>
    <div class="card" id="card"></div>
  </div>

  <div id="done" class="hide">
    <p class="eyebrow" id="dtag"></p>
    <div class="score" id="scorebox"></div>
  </div>
</div>

<script>
/* Sourced from the CKSci Grade 5 Investigating Matter Student Reader, Chapter 2,
   and Teacher Guide Lesson 3, "Applying Properties of Matter".
   Core Vocabulary for this lesson is exactly two: design process, solution.
   Both are tested. The powder results are the Teacher Guide's own observations. */

/* The evidence table the investigation actually produces. Note that salt and
   sugar behave identically in water — that collision is the whole point of the
   Big Question, and question s3-4 is built on it. */
const EV = [
  { n:"Flour",       w:"Becomes doughy and pasty",     v:"The vinegar rolls off it" },
  { n:"Table salt",  w:"Dissolves",                    v:"No change at all" },
  { n:"Sugar",       w:"Dissolves",                    v:"Partly dissolves" },
  { n:"Plaster",     w:"Absorbs the water and hardens",v:"Bubbles, melts, then hardens again" },
  { n:"Baking soda", w:"Turns milky and gets sticky",  v:"Foams, bubbles and makes noise" }
];

const DATA = {
  bigQuestion:"How can I use properties as evidence to identify matter?",
  sets:[
    { id:"m1", c:"var(--cyan)", tag:"The design process", name:"Five Steps, In Order",
      blurb:"The plan engineers use to turn a problem into a solution.",
      items:[
        { type:"pick", q:"What is the <b>design process</b>?",
          opts:["A plan that is used to find and develop solutions to a problem",
                "A way of measuring the properties of a sample",
                "A rule that says which materials are strongest",
                "A drawing of a finished invention"], a:0,
          why:"The design process is a plan that is used to find and develop solutions to a problem. It is a method people use to find and develop a solution.",
          cite:"Core Vocabulary · Student Reader, Chapter 2" },
        { type:"pick", q:"What is a <b>solution</b>?",
          opts:["A way to solve a problem",
                "A powder that has dissolved in water",
                "The last step of an investigation",
                "A list of the properties of a material"], a:0,
          why:"A solution is a way to solve a problem. It can be a physical object, or it can be a procedure for doing things a certain way.",
          cite:"Core Vocabulary · Student Reader, Chapter 2" },
        { type:"order", q:"Put the five steps of the design process back in order.",
          steps:["Define the problem \u2014 work out the criteria and the constraints.",
                 "Plan a solution \u2014 decide what will actually fix the problem.",
                 "Make a model \u2014 build something close enough to real life to test.",
                 "Test the model \u2014 under conditions like the ones it will really face.",
                 "Evaluate and redesign \u2014 did it meet the criteria? If not, change it and test again."],
          why:"Define the Problem, Plan a Solution, Make a Model, Test the Model, Evaluate and Redesign. The last step loops back: if testing shows the solution won't work, you redesign and test again.",
          cite:"Student Reader, Chapter 2, \u201cThe Design Process\u201d" },
        { type:"pick", q:"The rusty swing chains need replacing. Which step comes <em>first</em>?",
          opts:["Define the problem, and decide what the new chain has to do",
                "Buy the strongest rope available",
                "Test three ropes on the swing",
                "Draw a picture of the finished swing"], a:0,
          why:"The first step in the design process is to define the problem. You have to consider criteria, the standards by which something is judged, and constraints, which are limits on the design process.",
          cite:"Student Reader, Chapter 2" },
        { type:"pick", q:"Why does the last step of the process loop back to the beginning?",
          opts:["Because if testing shows the solution doesn't work, you redesign and test again",
                "Because every design has to be built exactly five times",
                "Because the criteria can never be changed once they are set",
                "Because a model must always be thrown away after one test"], a:0,
          why:"This is the stage to consider ways to redesign your solution based on testing and on other criteria and constraints you have uncovered. If your testing reveals that your solution won't work, you should test again and consider ways to redesign.",
          cite:"Student Reader, Chapter 2, \u201cEvaluate and Redesign\u201d" },
        { type:"pick", q:"The reader says some great inventions came out of something unexpected. What?",
          opts:["Errors or mistakes made during the design process",
                "Copying an existing solution exactly",
                "Skipping the testing step to save time",
                "Setting no criteria at all"], a:0,
          why:"Some solutions will work without meeting some or all of the criteria and constraints. Some great inventions have been the result of errors or mistakes in the design process.",
          cite:"Student Reader, Chapter 2" }
      ]},

    { id:"m2", c:"var(--amber)", tag:"Criteria and constraints", name:"The Swing Chain",
      blurb:"What the answer has to do, and what it is not allowed to cost.",
      items:[
        { type:"pick", q:"<b>Criteria</b> are the standards something is judged by. Which of these is a criterion for the new swing chain?",
          opts:["It must be easy to grip","It must cost very little",
                "It must weigh under a kilogram","It must fit a small child's hand span"], a:0,
          why:"The criteria \u2014 the things the solution needs to be \u2014 are strong, flexible, and easy to grip. Cost, the size of someone's grip, and weight are constraints, which are limits.",
          cite:"Student Reader, Chapter 2, \u201cSelecting Materials Based on Properties\u201d" },
        { type:"pick", q:"<b>Constraints</b> are limits on the design. Which of these is a constraint, not a criterion?",
          opts:["Cost","Strength","Flexibility","Being easy to grip"], a:0,
          why:"The constraints are cost, the size of someone's grip, and weight. Strong, flexible and easy to grip are criteria \u2014 things the solution needs to be.",
          cite:"Student Reader, Chapter 2" },
        { type:"pick", q:"Which properties of the old metal chain does the reader list?",
          opts:["Hard, flexible and shiny","Soft, heavy and dull",
                "Strong, cheap and light","Rough, rusty and brittle"], a:0,
          why:"The properties of the chain are hard, flexible and shiny. Notice that flexible is both a property it already has and a criterion the replacement must meet.",
          cite:"Student Reader, Chapter 2" },
        { type:"pick", q:"Nylon rope is strong and weathers well, but gets stiff in the cold. Jute rope is strong and easy to grip, but does not weather well. What should you do?",
          opts:["Test them, then evaluate and redesign \u2014 no option has to be perfect first time",
                "Pick nylon, because weathering matters more than grip",
                "Pick jute, because grip is a criterion and weathering is not",
                "Start over and find a material with no disadvantages at all"], a:0,
          why:"Each possible solution has advantages and disadvantages. You would examine why each solution didn't work and apply that as you redesign and test again. You can keep testing and retesting until you come up with a solution that works.",
          cite:"Student Reader, Chapter 2" },
        { type:"pick", q:"Why does the reader suggest starting by looking at solutions other people already used?",
          opts:["Your design can improve on the existing solution, or be a different one that solves the same problem",
                "Because copying an old solution is always fastest",
                "Because a new solution is not allowed to be different",
                "Because existing solutions have no disadvantages"], a:0,
          why:"To solve a problem, it helps to start by evaluating solutions that were used by others. Your design can improve on the existing solution or be a completely different solution that solves the same problem.",
          cite:"Student Reader, Chapter 2" },
        { type:"pick", q:"A model should be similar to real life. Why does that matter?",
          opts:["So you can test the solution under conditions like the ones it will really face",
                "So the model looks impressive to other people",
                "So the model can be sold as the finished product",
                "So you can skip the testing step"], a:0,
          why:"The model should be similar to real life so you can test your solution under similar circumstances. When you test your model, you should test it in similar conditions to how your solution will be used in real life.",
          cite:"Student Reader, Chapter 2" }
      ]},

    { id:"m3", c:"var(--violet)", tag:"Reading the evidence", name:"Five White Powders",
      blurb:"They all look alike. Water and vinegar tell them apart.",
      items:[
        { type:"pick", bench:true,
          q:"A sample turns <b>milky and sticky</b> in water, and <b>foams and bubbles</b> in vinegar. What is it?",
          opts:["Baking soda","Flour","Plaster","Sugar"], a:0,
          why:"When water is mixed with baking soda it turns a milky colour and becomes sticky. When vinegar is added, baking soda foams, bubbles, and makes noise. Both results point to the same sample.",
          cite:"Teacher Guide, Lesson 3 investigation" },
        { type:"pick", bench:true,
          q:"A sample <b>absorbs the water and hardens</b>, and in vinegar it <b>bubbles, melts, then hardens again</b>. What is it?",
          opts:["Plaster","Baking soda","Flour","Table salt"], a:0,
          why:"Plaster absorbs water and hardens. In vinegar, plaster bubbles, melts, and then hardens again.",
          cite:"Teacher Guide, Lesson 3 investigation" },
        { type:"pick", bench:true,
          q:"A sample becomes <b>doughy and pasty</b> in water, and the <b>vinegar rolls off it</b>. What is it?",
          opts:["Flour","Sugar","Plaster","Baking soda"], a:0,
          why:"Flour becomes doughy and pasty in water. When vinegar is mixed with flour, the vinegar rolls off.",
          cite:"Teacher Guide, Lesson 3 investigation" },
        { type:"pick", bench:true,
          q:"A sample <b>dissolves in water</b>. You have done no other test. What can you say?",
          opts:["It is either salt or sugar \u2014 one test is not enough to tell them apart",
                "It is definitely salt","It is definitely sugar",
                "It cannot be identified by any test"], a:0,
          why:"Salt and sugar both dissolve in water, so that result alone cannot separate them. This is exactly why more than one test is needed. In vinegar, salt shows no change at all while sugar partly dissolves \u2014 that second test tells them apart.",
          cite:"Teacher Guide, Lesson 3 investigation" },
        { type:"pick", bench:true,
          q:"The sample from the last question <b>partly dissolves</b> in vinegar. Now what is it?",
          opts:["Sugar","Table salt","Flour","Plaster"], a:0,
          why:"Sugar partially dissolves in vinegar; salt shows no change in vinegar. The second test is what settles it.",
          cite:"Teacher Guide, Lesson 3 investigation" },
        { type:"pick",
          q:"Why do the five powders all look so similar to begin with?",
          opts:["Because some types of matter share some properties, so you need the ones that are unique",
                "Because all white powders are made of the same matter",
                "Because properties cannot be seen without a microscope",
                "Because colour is the only property that matters"], a:0,
          why:"The powders are similar in colour and form, representing the fact that some types of matter share some properties. Each also has properties that are unique, and these can be identified under close inspection, such as when each is mixed with water or vinegar.",
          cite:"Teacher Guide, Lesson 3" }
      ]},

    { id:"m4", c:"var(--teal)", tag:"Capstone", name:"Be the Engineer",
      blurb:"A hole in the wall, five unlabelled jars, and a claim to defend.",
      items:[
        { type:"pick", bench:true,
          q:"There is a hole in a classroom wall. You need a powder that will mix with water and set hard. Which sample solves it?",
          opts:["Plaster","Flour","Table salt","Sugar"], a:0,
          why:"Plaster absorbs water and hardens \u2014 that is exactly the property the design problem needs. The investigation is written around this design problem: the repair of a hole in a wall.",
          cite:"Teacher Guide, Lesson 3" },
        { type:"pick", bench:true,
          q:"Someone says \u201cflour would work, it goes thick in water too.\u201d Using the evidence, why is that wrong?",
          opts:["Flour becomes doughy and pasty \u2014 it thickens, but it never hardens",
                "Flour does not mix with water at all",
                "Flour dissolves completely, so nothing is left",
                "Flour foams and bubbles, so it would push the patch out"], a:0,
          why:"Flour becomes doughy and pasty. Doughy is not the same as hard. The criterion is a material that sets hard, and only plaster does that.",
          cite:"Teacher Guide, Lesson 3 investigation" },
        { type:"pick", q:"In this investigation, what counts as <b>evidence</b>?",
          opts:["What you actually observed each sample do in the water and the vinegar",
                "What you expected each sample to do before testing",
                "The label that was originally on the jar",
                "Which sample you would prefer to use"], a:0,
          why:"Students use evidence from observations and measurements to support a scientific argument. The evidence is what the samples were observed to do \u2014 the results distinguish between types of matter based on their different properties.",
          cite:"Teacher Guide, Lesson 3 learning objectives" },
        { type:"build" },
        { type:"pick", q:"You made a claim and backed it with evidence. Which step of the design process comes next?",
          opts:["Test the model, then evaluate and redesign if it doesn't hold up",
                "Define the problem all over again from scratch",
                "Stop \u2014 a claim with evidence is the end of the process",
                "Make a second model without testing the first"], a:0,
          why:"Once a solution is planned and modelled, it is tested, then evaluated. If testing reveals the solution won't work, you redesign and test again.",
          cite:"Student Reader, Chapter 2, \u201cThe Design Process\u201d" },
        { type:"pick", q:"What is the Big Question of this chapter asking you to be able to do?",
          opts:["Use the properties you observe as evidence to work out what a sample of matter is",
                "Memorise the names of five white powders",
                "Measure the mass of every sample precisely",
                "Explain what matter is made of on the inside"], a:0,
          why:"How can I use properties as evidence to identify matter? The lesson's objectives are to investigate and record properties, to use evidence from observations to support an argument, and to identify samples as particular types of matter based on their properties.",
          cite:"Teacher Guide, Lesson 3 Big Question and learning objectives" }
      ]}
  ],

  /* Claim and evidence, the way the lesson's own wrap-up asks for it: state the
     claim, then pick only the observations that actually support it. The
     distractors are all real results from the same investigation. */
  build:{
    q:"Your claim: <b>the powder that will patch the hole is plaster.</b> Pick the <b>two</b> observations that are evidence for that claim.",
    tiles:[
      { t:"In water, this sample absorbed the water and hardened.", a:true },
      { t:"In vinegar, this sample bubbled, melted, and then hardened again.", a:true },
      { t:"In water, one of the other samples turned milky and sticky.", a:false },
      { t:"In vinegar, one of the other samples showed no change at all.", a:false },
      { t:"All five samples were white powders that looked alike.", a:false }
    ],
    need:2,
    answer:"Plaster absorbs water and hardens, and even after bubbling and melting in vinegar it hardens again. Hardening is the property the design problem needs, and only plaster shows it. What the other samples did is true, but it is not evidence for this claim.",
    cite:"Teacher Guide, Lesson 3 \u2014 Conclusions from Evidence (AP 3.2)"
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

let S=null, idx=0, log=[], tries=0, picked=null, order=[], chosen=new Set();
const best = MC.bests();

function benchHTML(){
  return `<div class="bench"><div class="lead">The lab bench &mdash; what each sample did</div>
    <table><thead><tr><th>Sample</th><th>In water</th><th>In vinegar</th></tr></thead><tbody>
    ${EV.map(e=>`<tr><td>${esc(e.n)}</td><td>${esc(e.w)}</td><td>${esc(e.v)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function home(){
  $("sets").innerHTML = DATA.sets.map((s,i)=>{
    const b = best[s.id], done = b!=null && b>=75;
    return `<button class="set ${b==null?"":(done?"mc-cleared":"mc-tried")}" style="--c:${s.c}" data-s="${i}">
      <span class="tag">${esc(s.tag)}</span>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.blurb)}</p>
      <span class="go">${s.items.length} questions &rsaquo;</span>
      ${b!=null?`<span class="badge mc-best${done?" mc-done":""}">${done?"CLEARED &middot; ":""}best ${b}%</span>`:""}
    </button>`;
  }).join("");
  [...document.querySelectorAll(".set")].forEach(b=>b.onclick=()=>start(+b.dataset.s));
  $("foot").innerHTML = "Questions, wording and vocabulary are drawn from the CKSci Grade 5 "+
    "<i>Investigating Matter</i> Student Reader, Chapter 2, and Teacher Guide Lesson 3.<br>"+
    "Based on an original work of the Core Knowledge Foundation (coreknowledge.org), used under "+
    "CC BY-NC-SA 4.0. This does not imply that the Core Knowledge Foundation endorses this work.";
  show("home");
}
function show(w){ ["home","play","done"].forEach(x=>$(x).classList.toggle("hide",x!==w)); window.scrollTo(0,0); }

function start(i){
  S = DATA.sets[i]; idx=0; log=[];
  MC.begin();
  $("sname").textContent = S.name.toUpperCase() + " \u00b7 " + S.tag;
  show("play"); render();
}

function render(){
  tries=0; picked=null; chosen=new Set();
  $("dots").innerHTML = S.items.map((_,i)=>
    `<span class="dot ${i<idx?"done":i===idx?"now":""}"></span>`).join("");
  const it = S.items[idx];
  const head = `<div class="qnum">Question ${idx+1} of ${S.items.length}</div>`;
  if(it.type==="pick")  return rPick(it, head);
  if(it.type==="order") return rOrder(it, head);
  return rBuild(head);
}

function rPick(it, head){
  const opts = shuffle(it.opts.map((t,i)=>({t,ok:i===it.a})));
  $("card").innerHTML = head + `<div class="q">${it.q}</div>` + (it.bench?benchHTML():"") +
    `<div class="opts" id="opts"></div><div class="act" id="act"></div><div id="fb"></div>`;
  $("opts").innerHTML = opts.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`).join("");
  $("act").innerHTML = `<button class="btn p" id="go" disabled>Check my answer</button>`;
  [...document.querySelectorAll(".opt")].forEach(b=>b.onclick=()=>{
    [...document.querySelectorAll(".opt")].forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); picked=+b.dataset.i; $("go").disabled=false;
  });
  $("go").onclick=()=>{
    const o=opts[picked], el=document.querySelector(`.opt[data-i="${picked}"]`);
    if(o.ok){ el.classList.add("right"); win(it); }
    else { el.classList.add("wrong"); el.classList.remove("sel");
           miss(it,"Not that one. Check the bench again and try another."); }
  };
}

function rOrder(it, head){
  order = shuffle(it.steps.map((t,i)=>({t,i})));
  $("card").innerHTML = head + `<div class="q">${it.q}</div>
    <div class="rows" id="rows"></div><div class="act" id="act"></div><div id="fb"></div>`;
  $("act").innerHTML = `<button class="btn p" id="go">Check the order</button>`;
  drawRows();
  $("go").onclick=()=>{
    let wrong=0;
    document.querySelectorAll(".row").forEach((r,n)=>{
      const ok=order[n].i===n; r.classList.add(ok?"right":"wrong"); if(!ok) wrong++;
    });
    if(!wrong){ $("go").remove(); win(it); }
    else { setTimeout(()=>document.querySelectorAll(".row").forEach(r=>r.classList.remove("right","wrong")),900);
           miss(it, wrong===1?"One step is out of place.":wrong+" steps are out of place."); }
  };
}
function drawRows(){
  $("rows").innerHTML = order.map((s,n)=>
    `<div class="row"><span class="n">${n+1}</span><span>${esc(s.t)}</span>
      <span class="mv">
        <button data-up="${n}" ${n===0?"disabled":""} aria-label="Move up">&uarr;</button>
        <button data-dn="${n}" ${n===order.length-1?"disabled":""} aria-label="Move down">&darr;</button>
      </span></div>`).join("");
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.up; [order[n-1],order[n]]=[order[n],order[n-1]]; drawRows(); });
  document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.dn; [order[n+1],order[n]]=[order[n],order[n+1]]; drawRows(); });
}

function rBuild(head){
  const B=DATA.build, tiles=shuffle(B.tiles.map((t,i)=>({...t,i})));
  $("card").innerHTML = head + `<div class="q">${B.q}</div>` + benchHTML() +
    `<div class="tiles" id="tiles"></div><div class="act" id="act"></div><div id="fb"></div>`;
  $("tiles").innerHTML = tiles.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t.t)}</button>`).join("");
  $("act").innerHTML = `<button class="btn p" id="go" disabled></button>`;
  const sync=()=>{ $("go").disabled = chosen.size!==B.need;
    $("go").textContent = chosen.size===B.need ? "Make my case" : `Pick ${B.need-chosen.size} more`; };
  [...document.querySelectorAll(".tile")].forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(chosen.has(i)){ chosen.delete(i); b.classList.remove("sel"); }
    else if(chosen.size<B.need){ chosen.add(i); b.classList.add("sel"); }
    sync();
  });
  sync();
  $("go").onclick=()=>{
    let wrong=0;
    chosen.forEach(i=>{
      const el=document.querySelector(`.tile[data-i="${i}"]`);
      if(tiles[i].a) el.classList.add("right"); else { el.classList.add("wrong"); wrong++; }
    });
    if(!wrong){
      document.querySelectorAll(".tile").forEach(t=>{ if(!t.classList.contains("right")) t.style.opacity=".35"; });
      $("go").remove(); win({why:B.answer, cite:B.cite}, true);
    } else {
      setTimeout(()=>document.querySelectorAll(".tile").forEach(t=>t.classList.remove("right","wrong")),1000);
      miss({why:"Every one of those observations really happened. Evidence has to be about the sample you are making a claim about.",
            cite:"Teacher Guide, Lesson 3"},
           wrong===1?"One of your two is a real result, but not evidence for this claim."
                    :"Both of those are real results, but neither is evidence for this claim.");
    }
  };
}

function miss(it,msg){
  tries++;
  MC.wrong(S.id+"-"+idx);
  $("fb").innerHTML = `<div class="fb no"><strong>Not yet.</strong>${esc(msg)}</div>`;
  if(tries>=2 && !$("hint")){
    $("act").insertAdjacentHTML("afterbegin",`<button class="btn o" id="hint">Show me the page</button>`);
    $("hint").onclick=()=>{
      $("fb").innerHTML = `<div class="fb no"><strong>From the lesson</strong>${esc(it.why)}
        <cite>${esc(it.cite)}</cite></div>`;
      $("hint").remove();
    };
  }
}
function win(it,isBuild){
  MC.right(S.id+"-"+idx);
  const pts = tries===0?100:tries===1?75:tries===2?50:25;
  log.push({pts,tries});
  const last = idx===S.items.length-1;
  if(isBuild){
    $("fb").innerHTML = `<div class="fb yes"><strong>Claim made, and backed.</strong>
      Those two observations are about the sample you are claiming about \u2014 that is what makes them evidence.</div>
      <div class="reveal"><div class="lead">Claim, evidence, reasoning</div>
        <p>${esc(it.why)}</p>
        <cite style="display:block;font:600 11px var(--mono);color:#7FA3A8;margin-top:8px">${esc(it.cite)}</cite>
      </div>`;
  } else {
    $("fb").innerHTML = `<div class="fb yes"><strong>${tries===0?"Right, first try.":"Got it."}</strong>
      ${esc(it.why)}<cite>${esc(it.cite)}</cite></div>`;
  }
  $("act").innerHTML = `<button class="btn g" id="next">${last?"See how I did":"Next question"}</button>`;
  $("next").onclick=()=>{ if(last) finish(); else { idx++; render(); window.scrollTo(0,0); } };
  $("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function finish(){
  const pct = Math.round(log.reduce((s,l)=>s+l.pts,0)/log.length);
  const first = log.filter(l=>l.tries===0).length;
  const att = log.reduce((s,l)=>s+l.tries,0)+log.length;
  const band = pct>=90?["Sharp work","#2F8F76"]:pct>=75?["Solid","#2E9BB4"]
             :pct>=50?["Getting there","#DFA23C"]:["Worth another run","#C4553F"];
  $("dtag").textContent = S.name.toUpperCase();
  $("scorebox").innerHTML = `
    <div class="ring" style="color:${band[1]}">${pct}%</div>
    <div class="band" style="color:${band[1]}">${band[0]}</div>
    <div class="stats">
      <div class="stat"><b>${first} / ${log.length}</b><span>First try</span></div>
      <div class="stat"><b>${att}</b><span>Total tries</span></div>
    </div>
    <div class="review"><b>Say it out loud</b>${esc(DATA.bigQuestion)}</div>
    <div class="act">
      <button class="btn p" id="again">Run this set again</button>
      <button class="btn o" id="pick">Pick another set</button>
    </div>`;
  MC.chest($("scorebox"), pct, {id:S.id});
  $("again").onclick=()=>start(DATA.sets.indexOf(S));
  $("pick").onclick=()=>{ Object.assign(best, MC.bests()); home(); };
  show("done");
}

home();
</script>
