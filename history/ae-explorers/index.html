<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Explorers — The Age of Exploration</title>
<meta name="theme-color" content="#1A2233">
<style>
:root{
  --ink:#27313F; --soft:#6B7786; --line:#E2DED3; --card:#FFFDF8;
  --rose:#E0709A; --lime:#63BE7B; --red:#E0685A; --amber:#E9B23C; --sky:#5AA9DB;
  --hist:#C98A3C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#141C2A;color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.hide{display:none !important}
.hublink{display:inline-block;color:#9FB0C6;text-decoration:none;font-size:14px;margin-bottom:6px}
.pagehead{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.back{width:42px;height:42px;flex:none;border:none;border-radius:13px;background:#243149;
  color:#CBD6E6;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back svg{width:22px;height:22px}
.pagehead .t strong{display:block;color:#F2F5FA;font-size:18px;line-height:1.2}
.pagehead .t span{display:block;color:#8FA0B6;font-size:12px;letter-spacing:1.4px;
  text-transform:uppercase;margin-top:3px;font-family:ui-monospace,Menlo,Consolas,monospace}
.eyebrow{color:#8FA0B6;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
  font-family:ui-monospace,Menlo,Consolas,monospace}
h1{color:#F2F5FA;font-size:27px;margin:6px 0 8px;line-height:1.15}
.sub{color:#A9B7C9;font-size:15px;margin:0 0 16px}
.rule{background:#1E2940;border-left:4px solid var(--hist);border-radius:0 12px 12px 0;
  padding:11px 14px;color:#C6D2E2;font-size:14.5px;margin:0 0 18px}

.qbtn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-left:6px solid var(--c,var(--hist));border-radius:15px;padding:13px 15px;margin-bottom:10px;
  cursor:pointer;font:inherit;color:var(--ink)}
.qbtn .tag{display:block;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--soft);font-family:ui-monospace,Menlo,Consolas,monospace}
.qbtn h3{margin:3px 0 3px;font-size:17px}
.qbtn p{margin:0;font-size:13.5px;color:var(--soft)}
.qbtn .go{display:block;margin-top:7px;font-size:13px;font-weight:700;color:var(--hist)}
.badge{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:800;letter-spacing:.6px;
  background:#F7EFE3;color:#8A5E24;border-radius:999px;padding:3px 9px}
footer{color:#7E8DA2;font-size:13px;text-align:center;margin-top:18px}

.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:10px}
.srow{border-top:1px solid var(--line);padding:11px 0}
.srow:first-child{border-top:none}
.srow b{display:block;font-size:16px}
.srow .c{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.5px;
  background:#EFEAF7;color:#5F5190;border-radius:999px;padding:2px 8px;margin:4px 0}
.srow p{margin:3px 0 0;font-size:14px;color:var(--soft);line-height:1.5}
.srow .pg{font-size:12px;color:var(--hist);font-weight:700}

.dots{display:flex;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.dot{height:5px;flex:1 1 10px;border-radius:3px;background:#2C3A54}
.dot.ok{background:var(--lime)} .dot.miss{background:var(--amber)} .dot.now{background:var(--rose)}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.qn{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--soft);
  font-family:ui-monospace,Menlo,Consolas,monospace}
.q{font-size:18.5px;line-height:1.45;margin:0 0 14px}

.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#FFF;
  border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:8px;
  font:inherit;color:var(--ink);cursor:pointer;line-height:1.35}
.opt .k{flex:none;width:23px;height:23px;border-radius:7px;background:#EEE9DC;color:var(--soft);
  font:800 12px ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center}
.opt.good{border-color:var(--lime);background:#E8F5E6}
.opt.good .k{background:var(--lime);color:#FFF}
.opt.bad{border-color:var(--red);background:#FBECEA}
.opt.bad .k{background:var(--red);color:#FFF}
.opt[disabled]{cursor:default}

.act{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font:800 15.5px inherit;cursor:pointer}
.btn.p{background:var(--hist);color:#FFF}
.btn.g{background:var(--lime);color:#FFF}
.btn.o{background:#FFF;color:var(--ink);border:1.5px solid var(--line)}

.fb{border-radius:13px;padding:11px 13px;margin-top:12px;font-size:14.5px;line-height:1.45}
.fb strong{display:block;margin-bottom:3px}
.fb.yes{background:#E8F5E6;color:#2F6B33;border-left:4px solid var(--lime)}
.fb.no{background:#FBECEA;color:#9A3B30;border-left:4px solid var(--red)}
.hintbox{background:#FBF3E4;border-left:4px solid var(--amber);border-radius:0 13px 13px 0;
  padding:11px 13px;margin-top:9px;font-size:14.5px;line-height:1.5;color:#6E5424}
.pg{display:inline-block;margin-top:6px;font:800 12.5px ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:.4px;color:#8A5E24;background:#F3E6D0;border-radius:999px;padding:3px 10px}

.score{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center}
.ring{font-size:52px;font-weight:800;line-height:1}
.band{font-size:17px;font-weight:800;margin-top:4px}
.outof{color:var(--soft);font-size:15px;margin-top:6px}
.review{background:#F3F0E7;border-radius:13px;padding:12px 14px;margin-top:14px;text-align:left;font-size:14.5px}
.review b{display:block;margin-bottom:7px}
.mrow{border-top:1px solid #E2DED3;padding:8px 0}
.mrow:first-of-type{border-top:none}
.mrow .w{font-weight:700}
.mrow .r{color:var(--soft);font-size:13.5px}
</style>
<!-- MC-THEME-CSS: generated by build_theme.py, do not hand-edit -->
<style>
/* ===== Minecraft theme layer — shared source, injected into all apps =====
   Everything is prefixed .mc- / #mc- so it cannot collide with app CSS.
   z-index budget in the apps: content < 30, HUD 30, scrim 40, drawer 50.
   Sprite bursts sit at 60 so they play over an auto-opening drawer.        */

.mc-hud{
  position:fixed; left:0; right:0; z-index:30;
  bottom:var(--mc-lift, 0px);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  pointer-events:none;
  background:linear-gradient(to top, rgba(0,0,0,.42), rgba(0,0,0,0));
  transition:bottom .18s;
}
.mc-hud img{image-rendering:pixelated; display:block}

.mc-hearts{
  display:flex; gap:1px; align-self:center;
  width:var(--mc-barw, 360px); box-sizing:border-box;
}
.mc-heart{width:var(--mc-hh,19px); height:auto}
/* heart-empty is very faint on dark art — read the row as sockets waiting */
.mc-heart[data-v="0"]{filter:drop-shadow(0 0 2px rgba(255,255,255,.5)) drop-shadow(0 0 5px rgba(0,0,0,.6)); opacity:.85}
.mc-heart.mc-hit{animation:mc-hit .42s}
@keyframes mc-hit{
  0%{transform:scale(1.55)} 25%{transform:scale(1.1) rotate(-8deg)}
  55%{transform:scale(1.25)} 100%{transform:none}
}

.mc-bar{display:flex; gap:0; width:var(--mc-barw,360px); box-sizing:border-box}
.mc-slot{
  position:relative; width:var(--mc-ss,38px); height:var(--mc-ss,38px);
  flex:0 0 auto; background-size:100% 100%; background-repeat:no-repeat;
}
.mc-slot .mc-tool{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:69%; height:69%; object-fit:contain;
}
/* tool-9 already has zero side margin in the source art — don't scale it up */
.mc-slot[data-n="9"] .mc-tool{width:62%; height:62%}
.mc-slot .mc-frame{position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px); opacity:0}
.mc-slot.mc-new .mc-frame{opacity:1; animation:mc-pulse 1.1s ease-in-out 3}
.mc-slot.mc-new .mc-tool{animation:mc-drop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes mc-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes mc-drop{from{transform:translate(-50%,-160%) scale(.4); opacity:0}}

/* ---- sprite burst ---- */
.mc-burst{
  position:fixed; left:50%; top:44%; z-index:60; pointer-events:none;
  width:var(--mc-burst,128px); height:var(--mc-burst,128px);
  transform:translate(-50%,-50%);
}
.mc-burst img{width:100%; height:100%; object-fit:contain; image-rendering:pixelated}
.mc-burst.mc-good{animation:mc-good 1.35s cubic-bezier(.18,1.3,.4,1) forwards}
.mc-burst.mc-bad{animation:mc-bad 1.15s ease-out forwards}
/* bad-2 creeper and bad-4 zombie carry ~30px of side margin; TNT and the
   spider fill the frame. Nudge the narrow two up so misses land evenly. */
.mc-burst.mc-bad[data-w="narrow"] img{transform:scale(1.17)}
@keyframes mc-good{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg); opacity:0}
  18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg); opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1}
  72%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1}
  100%{transform:translate(-50%,-80%) scale(1.05); opacity:0}
}
@keyframes mc-bad{
  0%{transform:translate(-50%,-50%) scale(.55); opacity:0}
  14%{transform:translate(-50%,-50%) scale(1.08); opacity:1}
  26%{transform:translate(-50%,-50%) scale(1); opacity:1}
  74%{transform:translate(-50%,-50%) scale(1); opacity:1}
  100%{transform:translate(-50%,-44%) scale(.96); opacity:0}
}

.mc-shake{animation:mc-shake .34s}
@keyframes mc-shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}

/* ---- results chest ---- */
.mc-chest{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:14px 10px 4px; margin:2px 0 6px;
  position:relative;   /* the victory flourish anchors to the chest */
}
.mc-chest .mc-lid{width:120px; height:120px; object-fit:contain; image-rendering:pixelated;
  transition:transform .2s; cursor:pointer}
.mc-chest .mc-lid.mc-shut{animation:mc-nudge 1.5s ease-in-out infinite}
@keyframes mc-nudge{0%,88%,100%{transform:none}92%{transform:translateY(-4px) rotate(-2deg)}96%{transform:translateY(-2px) rotate(2deg)}}
.mc-loot{display:flex; gap:6px; justify-content:center; min-height:4px; flex-wrap:wrap}
.mc-loot img{width:52px; height:52px; object-fit:contain; image-rendering:pixelated;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.mc-loot img:nth-child(2){animation-delay:.09s}
.mc-loot img:nth-child(3){animation-delay:.18s}
.mc-loot img:nth-child(4){animation-delay:.27s}
.mc-loot img:nth-child(5){animation-delay:.36s}
@keyframes mc-pop{from{transform:translateY(26px) scale(.3); opacity:0}}
.mc-tier{
  font:800 19px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.1em;
  text-align:center; margin-top:2px;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) .3s both;
}
.mc-tier[data-t="dragon"]{color:#A855C8}
.mc-tier[data-t="netherite"]{color:#6B5A6E}
.mc-tier[data-t="diamond"]{color:#2AA7B8}
.mc-tier[data-t="iron"]{color:#8A8A8A}
.mc-tier[data-t="stone"]{color:#7A7A7A}
.mc-tier[data-t="wood"]{color:#9A6B3F}
.mc-tier[data-t="corrections"]{color:#4A8230}
.mc-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.mc-badge{
  font:800 10.5px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.07em;
  background:#F0E6CF; color:#5A4A2E; border:2px solid #C7B48C; padding:4px 8px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.12), inset 2px 2px 0 rgba(255,255,255,.5);
  animation:mc-pop .45s cubic-bezier(.2,1.6,.4,1) both;
}
.mc-badge:nth-child(2){animation-delay:.1s}
.mc-badge:nth-child(3){animation-delay:.2s}
.mc-cap{
  font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em;
  text-transform:uppercase; opacity:.72; text-align:center;
}
.mc-earned{
  display:flex; align-items:center; gap:9px; justify-content:center;
  font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) .45s both;
}
.mc-earned img{width:38px; height:38px; object-fit:contain; image-rendering:pixelated}

.mc-boss{width:100%; max-width:256px; height:auto; image-rendering:pixelated;
  animation:mc-pop .6s cubic-bezier(.2,1.5,.4,1) .3s both}
/* fallback while boss-defeated.png is still outstanding */
.mc-bossfall{
  width:100%; max-width:280px; border-radius:12px; padding:13px 14px; text-align:center;
  background:linear-gradient(140deg,#1D1526,#3A1F2E); color:#FFD98A;
  border:2px solid #6B4A2E; box-shadow:0 6px 0 rgba(0,0,0,.25);
  font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.05em;
  animation:mc-pop .6s cubic-bezier(.2,1.5,.4,1) .3s both;
}
.mc-bossfall small{display:block; font-size:11px; opacity:.7; margin-top:4px; letter-spacing:.03em}

@media (prefers-reduced-motion:reduce){
  .mc-burst.mc-good,.mc-burst.mc-bad{animation-duration:.8s}
  .mc-shake{animation:none}
  .mc-chest .mc-lid.mc-shut{animation:none}
}

/* ---- level-picker status ----
   The apps' own .badge sat in the bottom-right corner of a tall card, so
   checking seven levels meant scanning seven different corners. Moved to the
   top-right, level with each card's eyebrow, which gives one straight vertical
   line to run your eye down. These sit later in the cascade at equal
   specificity, so they win without editing app CSS. */
.mc-best{
  top:11px !important; right:12px !important; bottom:auto !important;
  background:#E8A93C !important; color:#3A2A08 !important;
  font-weight:800 !important; letter-spacing:.04em; white-space:nowrap;
  padding:4px 9px !important; border-radius:3px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.16), inset 2px 2px 0 rgba(255,255,255,.35);
}
.mc-best.mc-done{background:#63A93E !important; color:#0F2216 !important}
/* and mark the card itself, so status is legible even mid-scroll */
.mc-cleared{box-shadow:inset 0 0 0 3px #63A93E !important}
.mc-tried{box-shadow:inset 0 0 0 3px #E8A93C !important}

/* ---- level chips (MC.picker) ----
   For apps whose levels are parallel and equally valid — history's five
   practice sets — so you can see and choose, not just be dealt one. */
.mc-picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.mc-chip{
  flex:1 1 auto; min-width:56px; min-height:44px; padding:5px 8px;
  border:2px solid #C7B48C; background:#F0E6CF; color:#5A4A2E; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.14), inset 2px 2px 0 rgba(255,255,255,.5);
}
.mc-chip:hover{filter:brightness(1.05)}
.mc-chip:focus-visible{outline:3px solid #63A93E;outline-offset:2px}
.mc-chip-l{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.mc-chip-s{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.7}
.mc-chip.mc-cleared{background:#63A93E;border-color:#3F7028;color:#0F2216}
.mc-chip.mc-tried{background:#E8A93C;border-color:#B07E18;color:#3A2A08}
.mc-chip.mc-now{box-shadow:inset -2px -2px 0 rgba(0,0,0,.14),
  inset 2px 2px 0 rgba(255,255,255,.5), 0 0 0 3px #2B79C2}

/* ---------- the mine ---------- */
.mc-ore{display:inline-flex;align-items:center;gap:5px;margin:3px 5px 3px 0;
  font:800 11px ui-monospace,"SF Mono",Consolas,monospace;color:#E8E3D6}
.mc-ore img{width:22px;height:22px;image-rendering:pixelated;display:block}
.mc-ore.mc-noart::before{content:"";width:20px;height:20px;background:var(--ore);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.34), inset 3px 3px 0 rgba(255,255,255,.22);
  border:2px solid rgba(0,0,0,.45)}
.mc-ore b{font-weight:800}
.mc-ore.mc-dim{opacity:.42}
.mc-haul,.mc-beacon{margin-top:10px;padding:9px 11px;background:rgba(0,0,0,.26);
  border:2px solid rgba(255,255,255,.10);text-align:left}
.mc-haullab{display:block;font:800 9.5px ui-monospace,Consolas,monospace;
  letter-spacing:.14em;color:#9FB0AA;margin-bottom:5px}
.mc-beacon small,.mc-shutportal small{display:block;margin-top:6px;
  font:600 11px system-ui,sans-serif;color:#9FB0AA;line-height:1.45}
.mc-beacon.mc-lit{border-color:#40D5D1;
  box-shadow:0 0 0 2px rgba(64,213,209,.22), 0 0 22px rgba(64,213,209,.28)}
.mc-shutportal{margin-top:10px;padding:10px 12px;background:#160E22;
  border:2px solid #4B2E73;color:#C9A6F0;text-align:left;
  font:800 11.5px ui-monospace,Consolas,monospace;letter-spacing:.1em}

.mc-blk{display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  margin:4px 9px 2px 0;font:800 10px ui-monospace,Consolas,monospace;color:#C4CFCB}
.mc-blk img{width:34px;height:34px;image-rendering:pixelated;display:block}
.mc-blk.mc-noart::before{content:"";width:30px;height:30px;background:var(--ore);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.34),inset 4px 4px 0 rgba(255,255,255,.22);
  border:2px solid rgba(0,0,0,.45)}
.mc-blk.mc-dim img{filter:grayscale(.15) brightness(.8)}
.mc-blk.mc-dim{opacity:.75;color:#7C8A85}
.mc-portal{float:right;width:46px;height:46px;margin:-2px 0 0 10px;image-rendering:pixelated;
  filter:grayscale(1) brightness(.6)}
.mc-egg{margin-top:10px;padding:8px 11px;background:rgba(0,0,0,.26);
  border:2px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:9px;
  font:800 10.5px ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#C9A6F0}
.mc-egg img{width:30px;height:30px;image-rendering:pixelated}

/* The purse, top-left of the HUD, opposite the sound switch. */
.mc-purse{position:absolute;left:calc(8px + env(safe-area-inset-left));
  bottom:calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:5px;pointer-events:none;
  padding:3px 8px 3px 5px;border:2px solid #0D0D0F;background:rgba(20,20,22,.82);
  font:800 13px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#FCFC54}
.mc-coin{width:17px;height:17px;display:block;image-rendering:pixelated}
/* stands in until the coin sprite exists, so this works before the art lands */
.mc-coin-fb{border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFE27A,#E0A83C 62%,#9C6F1E);
  border:2px solid #6E4B10;box-shadow:inset -2px -2px 0 rgba(0,0,0,.28)}
@media (max-width:400px){.mc-purse{font-size:12px;padding:2px 6px 2px 4px}
  .mc-coin{width:15px;height:15px}}

/* MC-TOGGLE-CSS-START — the hub borrows everything between these two
   markers, because it has its own stylesheet and needs only this control. */
/* The sound toggle: a real switch rather than a lettered button, so its state
   reads without being learned. Blocky border, hard inner bevel and the grass
   green of the banner, so it belongs to the same world as the hotbar. */
.mc-mute{
  position:fixed; z-index:60;
  top:calc(10px + env(safe-area-inset-top));
  right:calc(10px + env(safe-area-inset-right));
  display:flex; align-items:center; gap:7px;
  padding:5px 9px 5px 6px; border:3px solid #0D0D0F; background:#1F1F23;
  cursor:pointer; opacity:.94;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.06),
             0 3px 0 rgba(0,0,0,.35);
}
.mc-mute:hover{opacity:1}
.mc-mute:active{transform:translateY(2px); box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),
             inset 3px 3px 0 rgba(255,255,255,.06)}
.mc-mute:focus-visible{opacity:1; outline:3px solid #FCFC54; outline-offset:2px}

/* the track */
.mc-sw{
  position:relative; flex:none; width:50px; height:26px;
  background:#63A93E; border:3px solid #0D0D0F;
  box-shadow:inset 2px 2px 0 rgba(0,0,0,.28);
  transition:background .16s steps(2);
}
.mc-mute.off .mc-sw{background:#5A5A60}

/* the knob, carrying the speaker */
.mc-knob{
  position:absolute; top:-1px; left:22px; width:22px; height:22px;
  display:grid; place-items:center;
  background:#E9E6DE; color:#141416; border:2px solid #0D0D0F;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.22);
  transition:left .16s steps(3);
}
.mc-mute.off .mc-knob{left:-1px; background:#B9B5AC; color:#2A2A2E}
.mc-spk{width:15px; height:15px; display:block}

.mc-lbl{
  font:800 11px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:.1em; color:#63A93E; min-width:2.2em; text-align:left;
}
.mc-mute.off .mc-lbl{color:#8E8A82}

@media (max-width:420px){
  .mc-mute{gap:5px; padding:4px 7px 4px 5px}
  .mc-sw{width:42px; height:23px}
  .mc-knob{width:19px; height:19px; left:18px}
  .mc-spk{width:13px; height:13px}
  .mc-lbl{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  .mc-sw,.mc-knob{transition:none}
}
/* MC-TOGGLE-CSS-END */

/* MC-SKIN-CSS-START */
/* ===== what he is wearing ===================================================
   The engine stamps these on <html> as it loads, before first paint.
   The attribute selector outranks an app's own :root whichever order the
   stylesheets landed in. Overworld is the default and needs no rule. */

html[data-mc-theme="deepslate"]{
  --bg:#14171A; --gold:#93A7BC;
  --mc-glow:#23272E;
}
html[data-mc-theme="cherry"]{
  --bg:#2A1622; --gold:#F0A2BE;
  --mc-glow:#46203A;
}
html[data-mc-theme="nether"]{
  --bg:#1E0C0B; --gold:#FF9247;
  --mc-glow:#3F1512;
}
html[data-mc-theme="end"]{
  --bg:#0E0A18; --gold:#CFBAFF;
  --mc-glow:#241A3A;
}
/* The apps paint their own radial wash from a hard-coded colour, so a themed
   page re-paints it from the token. Bare :root keeps the original. */
html[data-mc-theme]:not([data-mc-theme="overworld"]) body{
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12% -6%, var(--mc-glow) 0%, transparent 55%);
}

/* ---------- the purse he carries ---------- */
.mc-purse{transition:box-shadow .2s, border-color .2s}
/* The hub runs with the HUD off and paints its own coin badge, so each skin
   names both. Without this, a bought purse is invisible on the one page he
   looks at most. */
html[data-mc-purse="gold"] .purselink,
html[data-mc-purse="gold"] .mc-purse{
  border-color:#E0A83C; box-shadow:0 0 0 1px #E0A83C inset, 0 0 12px rgba(224,168,60,.5)}
html[data-mc-purse="emerald"] .purselink,
html[data-mc-purse="emerald"] .mc-purse{
  border-color:#3FBF7F; box-shadow:0 0 0 1px #3FBF7F inset, 0 0 12px rgba(63,191,127,.5)}
html[data-mc-purse="netherite"] .purselink,
html[data-mc-purse="netherite"] .mc-purse{
  border-color:#6B5F6B; background:#1B171B;
  box-shadow:0 0 0 1px #8C7A96 inset, 0 0 14px rgba(140,122,150,.55)}
html[data-mc-purse="netherite"] .purselink b,
html[data-mc-purse="netherite"] .mc-purse b{color:#D8CBE4}

/* ---------- the flourish over the chest ----------
   Decorative only: it is added after the chest opens and removed a couple of
   seconds later. `pointer-events:none` so it can never swallow a tap on the
   buttons underneath, and it is skipped entirely for anyone who has asked their
   machine for less movement. */
.mc-fx{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:2}
.mc-fx i{position:absolute; top:44%; width:8px; height:8px; opacity:0;
  animation:mc-fx-fall 1.5s ease-out forwards}
.mc-fx-sparkle i{width:5px; height:5px; border-radius:50%; background:#FFE9A8;
  box-shadow:0 0 6px #FFD166}
.mc-fx-confetti i:nth-child(3n){background:#E0A83C}
.mc-fx-confetti i:nth-child(3n+1){background:#3FBF7F}
.mc-fx-confetti i:nth-child(3n+2){background:#5AA9E6}
.mc-fx-firework i{width:6px; height:6px; border-radius:50%;
  background:#FFF; box-shadow:0 0 10px 2px #FF9247}
.mc-fx-firework i:nth-child(2n){box-shadow:0 0 10px 2px #CFBAFF}
.mc-fx-ore i{width:9px; height:9px; border-radius:2px; background:#5AA9E6}
.mc-fx-ore i:nth-child(4n){background:#3FBF7F}
.mc-fx-ore i:nth-child(4n+1){background:#E0A83C}
.mc-fx-ore i:nth-child(4n+2){background:#C4553F}
@keyframes mc-fx-fall{
  0%{opacity:0; transform:translate(0,0) scale(.4)}
  12%{opacity:1}
  100%{opacity:0; transform:translate(var(--mc-dx,0), -150px) scale(1) rotate(220deg)}
}
@media (prefers-reduced-motion: reduce){ .mc-fx{display:none} }

/* ---------- the rank he is wearing ---------- */
.mc-title{
  display:inline-block; margin:0; padding:3px 10px; border-radius:999px;
  border:1px solid var(--gold); color:var(--gold);
  font:800 10.5px var(--mono,monospace); letter-spacing:.14em; text-transform:uppercase;
  background:rgba(255,255,255,.05)}

/* ---------- the character ----------
   Blocks, not a sprite: it always renders, costs no download, and recolours
   with whatever cape is on. Sizes are in em so the whole figure scales from one
   font-size on .mc-hero. */
.mc-hero{display:flex;flex-direction:column;align-items:center;gap:9px;
  font-size:9px;padding:14px 10px 12px;position:relative}
.mc-heroart{position:relative;width:9em;height:20em;flex:none}
.mc-heroart i{position:absolute;display:block;image-rendering:pixelated}

/* head, face, body, limbs — Steve's proportions, near enough */
.mc-head{left:2em;top:0;width:5em;height:5em;background:#B5825C;
  box-shadow:inset 0 -0.6em 0 rgba(0,0,0,.16)}
.mc-face{position:absolute;left:0.6em;top:1.8em;width:3.8em;height:1.2em;
  background:
    linear-gradient(90deg,#3A2E24 0 0.8em,transparent 0.8em),
    linear-gradient(90deg,transparent 0 2.4em,#3A2E24 2.4em 3.2em,transparent 3.2em);
  background-repeat:no-repeat}
.mc-head::before{content:"";position:absolute;left:0;top:0;width:5em;height:1.6em;
  background:#3A2A1C}                       /* hair */
.mc-body{left:2.5em;top:5em;width:4em;height:6em;background:#2F8F76;
  box-shadow:inset -0.5em 0 0 rgba(0,0,0,.14)}
.mc-arm{top:5em;width:1.6em;height:6em;background:#2F8F76}
.mc-arm.l{left:0.9em}
.mc-arm.r{left:6.5em;box-shadow:inset -0.4em 0 0 rgba(0,0,0,.14)}
.mc-arm::after{content:"";position:absolute;left:0;bottom:0;width:1.6em;height:1.6em;
  background:#B5825C}                       /* hands */
/* a sliver between the legs, or the two read as one block */
.mc-leg{top:11em;width:1.9em;height:6em;background:#3B5A9B}
.mc-leg.l{left:2.5em}
.mc-leg.r{left:4.6em;box-shadow:inset -0.4em 0 0 rgba(0,0,0,.16)}

/* the cape, behind the shoulders. `none` is the plain figure. */
.mc-cape{left:1.9em;top:4.6em;width:5.2em;height:8.4em;border-radius:0 0 0.4em 0.4em;
  background:transparent;transition:background .18s}
.mc-hero[data-cape="none"] .mc-cape{display:none}
.mc-hero[data-cape="ender"]   .mc-cape{background:#4B2E83;box-shadow:inset -0.6em 0 0 rgba(0,0,0,.22)}
.mc-hero[data-cape="scarlet"] .mc-cape{background:#9E2B25;box-shadow:inset -0.6em 0 0 rgba(0,0,0,.22)}
.mc-hero[data-cape="forest"]  .mc-cape{background:#215E3C;box-shadow:inset -0.6em 0 0 rgba(0,0,0,.22)}
.mc-hero[data-cape="frost"]   .mc-cape{background:#5E93B8;box-shadow:inset -0.6em 0 0 rgba(0,0,0,.22)}
.mc-hero[data-cape="gilded"]  .mc-cape{background:#C89A34;
  box-shadow:inset -0.6em 0 0 rgba(0,0,0,.2), inset 0 0 0 0.4em #F0D585}
.mc-hero[data-cape="elytra"]  .mc-cape{background:#6E6A78;width:8em;left:0.5em;
  border-radius:0.4em 0.4em 2.6em 2.6em;
  box-shadow:inset -0.6em 0 0 rgba(0,0,0,.2), inset 0 0 0 0.35em #9B96A8}

/* a real sprite, if one is ever dropped in, sits on exactly this markup */
.mc-hero img.mc-skin{position:absolute;inset:0;width:100%;height:100%}

.mc-heroname{font:800 10px var(--mono,monospace);letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold,#E0A83C);text-align:center}
.mc-heropurse{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  border:2px solid rgba(255,255,255,.18)}
.mc-heropurse b{font:800 14px var(--mono,monospace);color:var(--gold,#E0A83C)}
.mc-heropurse .mc-coin{width:15px;height:15px}
@media (min-width:520px){ .mc-hero{font-size:11px} }

/* ---------- what he has earned, on the figure ----------
   The armour steps up as the tool set fills: plain cloth, then iron, then gold,
   then diamond at all nine. Nothing here can be bought. */
.mc-hero[data-kit="iron"]    .mc-body,.mc-hero[data-kit="iron"]    .mc-arm{background:#B6BBC2}
.mc-hero[data-kit="iron"]    .mc-leg{background:#8B9099}
.mc-hero[data-kit="gold"]    .mc-body,.mc-hero[data-kit="gold"]    .mc-arm{background:#DEB244}
.mc-hero[data-kit="gold"]    .mc-leg{background:#A9822C}
.mc-hero[data-kit="diamond"] .mc-body,.mc-hero[data-kit="diamond"] .mc-arm{background:#4FC3C7}
.mc-hero[data-kit="diamond"] .mc-leg{background:#2E8E96}
/* the hands stay skin whatever the armour is */
.mc-hero .mc-arm::after{background:#B5825C}

/* the newest tool, held at his side */
.mc-held{position:absolute;left:7.4em;top:8.4em;width:4.4em;height:4.4em;
  transform:rotate(18deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

/* one mark per dragon, and there is rarely more than one */
.mc-dragonmark{left:0;top:0.4em;width:2.2em;height:2.2em;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#C9A6FF,#5B3A9E 62%,#2A1750);
  box-shadow:0 0 0 0.25em rgba(0,0,0,.35), 0 0 10px rgba(160,110,255,.7)}

.mc-herokit{font:700 10px var(--mono,monospace);letter-spacing:.06em;
  color:var(--stone,#8A9490);text-align:center}

/* the middle way out, between this app and the whole site */
.hublink.subject{margin-left:14px}
/* MC-SKIN-CSS-END */
</style>

<script>/* ===== Minecraft theme layer — shared source =====
   Built once, injected into every app. Do not edit inside an app's
   index.html; edit theme/mc.js and rebuild, or the four copies drift.

   Contract:
     MC.config({app, shake, lift, dragon})  once, before anything else
     MC.begin(id)                           entering a level — refills hearts
     MC.right()                             a correct answer
     MC.wrong(missKey)                      a wrong answer — costs half a heart
     MC.note(missKey)                       record a miss without spending one
     MC.credit(missKey)                     count a fix without a burst
     MC.clear(id, pct, {boss})              level finished — may award a tool
     MC.chest(el, pct, {id})                paint the results reveal into el
     MC.bests()                             {id: bestPct} for this app
     MC.mute(on)                            sound off/on, remembered across apps
     MC.ask(item)                           the wording to ask it in this run
     MC.runs(id)                            every attempt at one activity
     MC.picker(el, items, cur, onPick)       a strip of level chips
     MC.state()                             read-only snapshot (used by the hub)

   No death, no game over. Hearts only shrink the loot. A kid who is stuck
   must never hit a wall — see HANDOFF.
*/
(function () {
  "use strict";

  var PREFIX = window.__MC_PREFIX__ || "../../assets/";
  var INLINE = window.__MC_INLINE__ || null;
  var HAS_BOSS = window.__MC_HAS_BOSS__ === true;
  var url = function (n) { return INLINE ? (INLINE[n] || "") : PREFIX + n + ".png"; };

  /* ---------- persistence (shared origin, so shared across all four apps) ---------- */
  var KEY = "mc.study.v1";
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
  if (!S.cleared || typeof S.cleared !== "object") S.cleared = {};
  if (!S.misses || typeof S.misses !== "object") S.misses = {};
  if (typeof S.tool9 !== "boolean") S.tool9 = false;
  if (!S.ore || typeof S.ore !== "object") S.ore = {};
  if (!S.gem || typeof S.gem !== "object") S.gem = {};   // "app:id" -> diamond taken
  if (typeof S.dragon !== "number") S.dragon = 0;
  /* Every attempt, not just the best one: "app:id" -> [{p:pct, t:when, x:partial}].
     `cleared` keeps the high score because that is what the game rewards, but a
     parent wants the shape of the practice — three tries drifting down is worth
     knowing about even when the best of them was 90. Capped so a year of daily
     practice cannot fill localStorage. */
  if (!S.runs || typeof S.runs !== "object") S.runs = {};
  var RUNS_KEPT = 25;
  if (typeof S.mute !== "boolean") S.mute = false;
  /* Coins. The tools run out and the mine takes a while to open, so there was a
     long middle stretch where a good run paid nothing. Coins pay on every run,
     from the first one, scaled to how it went — a floor that never disappears
     and a ceiling that never arrives. */
  if (typeof S.coins !== "number" || !isFinite(S.coins)) S.coins = 0;

  /* Two numbers, not one. `coins` is the spendable balance; `earned` is every
     coin ever paid out and never goes down, so buying something does not shrink
     the year's total — it moves it into things owned. Without this a shop would
     break the one rule the whole design rests on: nothing earned is taken away.

     Anyone who was here before the shop existed has earned at least what they
     are holding, so that is where their total starts. */
  if (typeof S.earned !== "number" || !isFinite(S.earned)) S.earned = S.coins;
  if (S.earned < S.coins) S.earned = S.coins;
  if (!S.owned || typeof S.owned !== "object") S.owned = {};
  if (!S.equip || typeof S.equip !== "object") S.equip = {};

  /* ---------- sound ----------
     Every answer is heard: a coin when he is right, a soft glass note when he
     is not, and an unlock when a tool is earned. The wrong note is deliberately
     the gentlest of the three — it marks the moment without scolding, which is
     the same reason hearts shrink the loot instead of ending the run.

     All three arrive base64-inlined from the injector, like the sprites under
     --inline, so an app is still one file you can open from anywhere. They are
     small enough (about 18 KB of base64 between them) to inline on every build
     rather than only when asked. */
  var SFX = window.__MC_SFX__ || null;
  var VOL = 0.32;                       // quiet by default; this is a study aid
  /* The wrong note fires more often than either of the others, so it sits
     lower — audible, but never the loudest thing in the room. */
  var VOLS = { correct: 0.32, tool: 0.38, wrong: 0.20 };
  var clips = null, primed = false;

  function vol(k) { return VOLS[k] === undefined ? VOL : VOLS[k]; }

  function build_clips() {
    if (clips || !SFX) return;
    clips = {};
    for (var k in SFX) {
      try {
        var a = new Audio(SFX[k]);
        a.preload = "auto";
        a.volume = vol(k);
        clips[k] = a;
      } catch (e) { /* no Audio in this environment — stay silent */ }
    }
  }

  /* Browsers refuse to play audio until the user has interacted with the page,
     and the refusal is a rejected promise, not an error we would otherwise see.
     So on the first touch or key we start each clip muted and immediately stop
     it, which satisfies the policy and leaves them ready to fire instantly. */
  function unlock() {
    if (primed) return;
    primed = true;
    build_clips();
    for (var k in clips) prime_one(clips[k], vol(k));
    document.removeEventListener("pointerdown", unlock, true);
    document.removeEventListener("keydown", unlock, true);
  }
  function prime_one(a, v) {
    try {
      a.volume = 0;
      var p = a.play();
      var settle = function () { try { a.pause(); a.currentTime = 0; } catch (e) {} a.volume = v; };
      if (p && p.then) p.then(settle, settle); else settle();
    } catch (e) { a.volume = v; }
  }
  if (typeof document !== "undefined" && document.addEventListener) {
    document.addEventListener("pointerdown", unlock, true);
    document.addEventListener("keydown", unlock, true);
  }

  function play(name) {
    if (S.mute || !SFX) return;
    build_clips();
    var a = clips && clips[name];
    if (!a) return;
    try {
      a.currentTime = 0;
      a.volume = vol(name);
      var p = a.play();
      if (p && p.catch) p.catch(function () { /* still locked; next one will land */ });
    } catch (e) { /* never let a missing speaker break a question */ }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var TOOLS = ["wooden pickaxe", "stone pickaxe", "iron pickaxe", "diamond pickaxe",
               "sword", "torch", "shield", "bow", "elytra"];

  /* Tools 1-8 come from how many activities have been cleared anywhere on the
     site at 75%+. Tool 9, the elytra, only ever comes from spelling Challenge 2 —
     the one level where he writes his own sentences. */
  /* ---------- the mine ----------
     The tool bar was the whole ladder, and with twenty-odd activities on the
     site he fills it long before he runs out of work. So the tools are only
     the first age. Once all nine are held the mine opens, and from then on
     what a run is worth depends on how well it went rather than on whether it
     was new. Coal through gold are repeatable, so there is always something to
     dig; diamond is once per activity, so the only way to a pile of them is
     breadth AND mastery; emerald comes from the dragon alone. */
  var ORE = [
    { k: "coal",     name: "coal",     hex: "#2C2C30" },
    { k: "copper",   name: "copper",   hex: "#C1663F" },
    { k: "iron",     name: "iron",     hex: "#C6C2BC" },
    { k: "gold",     name: "gold",     hex: "#E4C04A" },
    { k: "redstone", name: "redstone", hex: "#B4262A" },
    { k: "lapis",    name: "lapis",    hex: "#2A5CB4" },
    { k: "diamond",  name: "diamond",  hex: "#40D5D1" },
    { k: "emerald",  name: "emerald",  hex: "#2FA84F" }
  ];
  var ORE_BY = {};
  for (var _o = 0; _o < ORE.length; _o++) ORE_BY[ORE[_o].k] = ORE[_o];

  /* A beacon is built from the four block types Minecraft actually accepts.
     Nine of a mineral makes a block. */
  var BEACON = ["iron", "gold", "diamond", "emerald"];

  function oreCount(k) { return S.ore[k] || 0; }
  function blocks(k) { return Math.floor(oreCount(k) / 9); }
  function beaconLit() {
    for (var i = 0; i < BEACON.length; i++) if (blocks(BEACON[i]) < 1) return false;
    return true;
  }

  /* How many cleared activities each of the first eight tools costs.
     It used to be one apiece, which was written when the site had about a dozen
     activities. There are forty now, so the whole hotbar filled inside a
     fortnight and the next thirty-odd runs paid nothing at all. Spread over a
     term instead, steeply enough at the start that the first two still arrive
     the same evening. */
  var TOOL_GATE = [1, 2, 3, 5, 7, 10, 14, 18];

  function clearedCount() {
    var n = 0, k;
    for (k in S.cleared) if (S.cleared[k] >= 75) n++;
    return n;
  }
  /* The ninth tool used to hang on one specific level, spelling:l7. If that
     level was never set as homework the mine could not open at all — he could
     clear all forty activities and still be locked out. It now asks for breadth:
     something cleared in every subject he has work in. That cannot strand him,
     and it rewards the thing worth rewarding. */
  function subjectsCleared() {
    var seen = {}, k;
    for (k in S.cleared) if (S.cleared[k] >= 75) seen[k.split(":")[0]] = 1;
    var n = 0, a;
    for (a in seen) n++;
    return n;
  }
  function toolsFrom(n) {
    var got = 0;
    for (var i = 0; i < TOOL_GATE.length; i++) if (n >= TOOL_GATE[i]) got = i + 1;
    return got;
  }
  function unlocked() {
    var n = toolsFrom(clearedCount());
    var nine = !!S.tool9 || subjectsCleared() >= ELYTRA_SUBJECTS;
    return { count: n, nine: nine, all9: n >= 8 && nine,
             cleared: clearedCount(), next: TOOL_GATE[n] || null };
  }
  var ELYTRA_SUBJECTS = 5;   // history, science, reading, spelling, vocabulary
  function mineOpen() { return unlocked().all9; }
  function has(slot) { var u = unlocked(); return slot === 9 ? u.nine : slot <= u.count; }

  /* ---------- state ---------- */
  var cfg = { app: "app", shake: null, lift: null, burst: 320, hud: true,
              subject: null,   /* which subject this app belongs to */
              /* Which activities can summon the dragon. null = any level in this
                 app. An array restricts it to those ids — spelling passes ["l7"]
                 so only Challenge 2, the hardest level of whatever week's list
                 is loaded, can wake it. */
              dragon: null };
  var halves = 20;          // 10 hearts, tracked in halves
  var missedHere = {};      // keys missed during this level
  var fixedHere = 0;        // ...and later got right — the comeback count
  var partialRun = false;   // a correction round over just the missed items
  var hud, heartsEl, barEl, muteEl, purseEl, lastNew = 0;
  var goodN = 0, badN = 0;  // cycle the sprites so it isn't the same one every time
  var askSeq = 0, askPick = {};   // which wording each question is using this run

  /* The sound toggle sits at the top of every page, on its own rather than
     inside the HUD. Two reasons: the HUD lives at the bottom and only appears
     once a level starts, and the two Wordly Wise tests run with hud:false — so
     a toggle parented to the HUD left no way at all to mute a test. This mounts
     on the hub as well, wherever the engine is present and there is sound. */
  function mountMute() {
    if (muteEl || !SFX || typeof document === "undefined" || !document.body) return;
    muteEl = document.createElement("button");
    muteEl.type = "button";
    muteEl.id = "mc-mute";
    muteEl.addEventListener("click", function () { MC.mute(!S.mute); });
    document.body.appendChild(muteEl);
    drawMute();
  }
  if (typeof document !== "undefined" && document.addEventListener) {
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", mountMute);
    else mountMute();
  }

  /* A speaker, drawn rather than set in type: a musical note said "sound" but
     not "sound is on", and the note-with-a-stroke was too small a mark to read
     at a glance. A crossed-out speaker is the sign everyone already knows. */
  function speaker(off) {
    var cone = '<path d="M3 9.5v5h3.2L11 18.5v-13L6.2 9.5H3z"/>';
    var waves = off ? ""
      : '<path d="M13.6 8.4a4.6 4.6 0 010 7.2" fill="none" stroke="currentColor"' +
        ' stroke-width="1.9" stroke-linecap="round"/>' +
        '<path d="M15.9 6a7.8 7.8 0 010 12" fill="none" stroke="currentColor"' +
        ' stroke-width="1.9" stroke-linecap="round"/>';
    var slash = off
      ? '<path d="M13.2 8.6l6.4 6.8" fill="none" stroke="currentColor"' +
        ' stroke-width="2.2" stroke-linecap="round"/>'
      : "";
    return '<svg class="mc-spk" viewBox="0 0 24 24" aria-hidden="true" focusable="false"' +
           ' fill="currentColor">' + cone + waves + slash + '</svg>';
  }

  /* The purse. Deliberately on screen the whole time he is working, because the
     point of a currency is that it is visibly going up. Falls back to a drawn
     coin if the sprite is not there yet, so this works before the art lands. */
  /* What he is wearing, stamped on the root element as the engine loads so a
     plain CSS rule can pick it
     up. `html[data-mc-theme=...]` outranks an app's own `:root`, so a theme
     repaints every page whichever order the stylesheets landed in. */

  /* ---------- a way back to the subject ----------
     Leaving a chapter used to mean going out to the whole site and finding the
     subject again. This sits between the two: back to the subject you are
     working through, with its section already open.

     Drawn by the engine so every app gets it without its own shell being
     touched, and placed after whatever link is already there. The path comes
     from the sprite prefix, which every page has to declare correctly anyway. */
  function subjectLink() {
    if (!cfg.subject) return;
    if (document.getElementById("mc-tosubject")) return;
    var first = document.querySelector(".hublink");
    if (!first || !first.parentNode) return;
    var hub = PREFIX.replace(/assets\/?$/, "index.html");
    var a = document.createElement("a");
    a.id = "mc-tosubject";
    a.className = "hublink subject";
    a.href = hub + "#" + cfg.subject.toLowerCase();
    a.innerHTML = "&lsaquo; " + cfg.subject;
    if (first.nextSibling) first.parentNode.insertBefore(a, first.nextSibling);
    else first.parentNode.appendChild(a);
  }

  function skin() {
    var r = document.documentElement;
    /* Cosmetic, so it must never be the reason the engine fails to load. */
    if (!r || !r.setAttribute) return;
    r.setAttribute("data-mc-theme", S.equip.theme || "overworld");
    r.setAttribute("data-mc-purse", S.equip.purse || "leather");
    r.setAttribute("data-mc-cape", S.equip.cape || "none");
  }

  /* The flourish over the chest at the end of a set. Sparkle is the one
     everybody starts with; the rest are bought. Purely decorative, and it
     cleans up after itself so nothing accumulates in the DOM.

     Named `flourish` and not `burst`, because there was a second function
     called burst further down for the win/lose sprites. Two declarations of
     one name in one scope is not an error: the later one simply wins, so the
     chest was calling the sprite burst with a DOM node where it wanted a
     sprite name, and painting a broken image over the results screen. This
     one had never run at all, which is to say the flourishes on sale in the
     shop had never once been drawn. */
  function flourish(host) {
    var kind = S.equip.effect || "sparkle";
    var n = kind === "ore" ? 22 : kind === "firework" ? 18 : kind === "confetti" ? 16 : 10;
    var box = document.createElement("div");
    box.className = "mc-fx mc-fx-" + kind;
    for (var i = 0; i < n; i++) {
      var b = document.createElement("i");
      b.style.left = (6 + Math.random() * 88).toFixed(2) + "%";
      b.style.animationDelay = (Math.random() * 0.45).toFixed(2) + "s";
      b.style.setProperty("--mc-dx", (Math.random() * 60 - 30).toFixed(1) + "px");
      box.appendChild(b);
    }
    host.appendChild(box);
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 2600);
  }


  /* ---------- the character ----------
     Drawn from blocks so it always renders and always matches whatever is on.
     `heroHosts` remembers where it has been drawn, so equipping something in
     the shop redraws it there without the page having to ask. */
  var heroHosts = [];

  /* Which armour the figure is wearing is earned, not bought: it steps up as
     the tool set fills. Nothing is ever taken away, so it only ever improves. */
  function armourTier() {
    var u = unlocked();
    var n = u.count + (u.nine ? 1 : 0);
    return n >= 9 ? "diamond" : n >= 6 ? "gold" : n >= 3 ? "iron" : "none";
  }

  function heroHTML(title) {
    var u = unlocked();
    var tools = u.count + (u.nine ? 1 : 0);
    var cape = S.equip.cape || "none";
    /* Tools come in order, and the ninth is separate — it is the one that
       wants breadth rather than depth. has() knows the rule; this asks it. */
    var newest = 0;
    for (var t = 1; t <= 9; t++) if (has(t)) newest = t;
    var held = newest ? url("tool-" + newest) : "";
    var oreTotal = 0;
    for (var k in S.ore) oreTotal += S.ore[k] || 0;

    var line = tools >= 9
      ? (S.dragon ? "Every tool, and the dragon" : "Every tool is yours")
      : tools + " of 9 tools";
    if (oreTotal) line += " \u00b7 " + oreTotal + " ore";

    return '<div class="mc-hero" data-cape="' + cape + '" data-kit="' + armourTier() + '">' +
             '<div class="mc-heroart">' +
               '<i class="mc-cape"></i>' +
               '<i class="mc-head"><i class="mc-face"></i></i>' +
               '<i class="mc-arm l"></i><i class="mc-arm r"></i>' +
               '<i class="mc-body"></i>' +
               '<i class="mc-leg l"></i><i class="mc-leg r"></i>' +
               (held ? '<img class="mc-held" alt="" src="' + held +
                       '" onerror="this.remove()">' : "") +
               (S.dragon ? '<i class="mc-dragonmark" title="Dragon slain"></i>' : "") +
             '</div>' +
             (title ? '<div class="mc-heroname">' + title + '</div>' : "") +
             '<div class="mc-herokit mc-hero-kit">' + line + '</div>' +
             '<div class="mc-heropurse">' +
               (url("coin") ? '<img class="mc-coin" alt="" src="' + url("coin") +
                              '" onerror="this.remove()">'
                            : '<i class="mc-coin mc-coin-fb"></i>') +
               "<b>" + S.coins + "</b></div>" +
           "</div>";
  }

  function drawHeroes() {
    for (var i = 0; i < heroHosts.length; i++) {
      var h = heroHosts[i];
      if (h.node && h.node.parentNode) h.node.innerHTML = heroHTML(h.title);
    }
  }

  function drawCoins() {
    if (!purseEl) return;
    var src = url("coin");
    purseEl.innerHTML = (src ? '<img class="mc-coin" alt="" src="' + src + '">'
                             : '<i class="mc-coin mc-coin-fb"></i>') +
                        '<b>' + S.coins + '</b>';
  }

  function drawMute() {
    if (!muteEl) return;
    muteEl.innerHTML =
      '<span class="mc-sw"><span class="mc-knob">' + speaker(S.mute) + '</span></span>' +
      '<span class="mc-lbl">' + (S.mute ? "OFF" : "ON") + '</span>';
    muteEl.setAttribute("aria-label",
      S.mute ? "Sound off — tap to turn sound on" : "Sound on — tap to mute");
    muteEl.setAttribute("aria-pressed", S.mute ? "true" : "false");
    muteEl.setAttribute("title", S.mute ? "Sound off" : "Sound on");
    muteEl.className = "mc-mute" + (S.mute ? " off" : "");
  }

  /* ---------- HUD ---------- */
  function build() {
    if (hud || cfg.hud === false) return;
    hud = document.createElement("div");
    hud.className = "mc-hud";
    hud.id = "mc-hud";
    hud.innerHTML = '<div class="mc-purse" id="mc-purse"></div>' +
                    '<div class="mc-hearts" id="mc-hearts"></div>' +
                    '<div class="mc-bar" id="mc-bar"></div>';
    document.body.appendChild(hud);
    purseEl = hud.querySelector("#mc-purse");
    drawCoins();
    heartsEl = hud.querySelector("#mc-hearts");
    barEl = hud.querySelector("#mc-bar");
    drawBar();
    drawHearts();
    fit();
    window.addEventListener("resize", fit);
    // the app's own bar can grow when feedback appears — ride above it
    if (cfg.lift && window.ResizeObserver) {
      var t = document.querySelector(cfg.lift);
      if (t) new ResizeObserver(function () { lift(); }).observe(t);
    }
    // the HUD is appended before the rest of the page parses, so its height
    // is not final yet; re-measure once the document is up
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", fit);
    else setTimeout(fit, 0);
    window.addEventListener("orientationchange", function () { setTimeout(fit, 120); });
  }

  /* The hotbar must never wrap and must never overflow. Size the slot from the
     viewport and let the hearts follow it. Checked 300-1024px. */
  function fit() {
    if (!hud) return;
    var vw = Math.max(280, document.documentElement.clientWidth || window.innerWidth);
    var vh = Math.max(320, document.documentElement.clientHeight || window.innerHeight);
    var bsz = Math.max(150, Math.min(cfg.burst, Math.round(vw * 0.55), Math.round(vh * 0.42)));
    var avail = Math.min(430, vw - 16);
    var ss = Math.max(24, Math.min(46, Math.floor(avail / 9)));
    var barw = ss * 9;
    hud.style.setProperty("--mc-ss", ss + "px");
    hud.style.setProperty("--mc-barw", barw + "px");
    hud.style.setProperty("--mc-hh", Math.max(13, Math.round(ss * 0.5)) + "px");
    hud.style.setProperty("--mc-burst", bsz + "px");
    document.documentElement.style.setProperty("--mc-burst", bsz + "px");
    lift();
    // keep app content clear of the HUD
    var h = hud.offsetHeight || 70;
    document.body.style.paddingBottom = (h + (cfg._liftpx || 0) + 10) + "px";
  }

  /* Only the vocabulary app has a persistent fixed bar of its own, and it grows
     when feedback appears. Ride above whatever height it currently is.

     The test used to be `t.offsetParent !== null`, which is the usual way to ask
     whether an element is on screen — except that offsetParent is null for any
     element whose position is fixed, and the bar this is measuring is fixed by
     definition: that is why it needs riding above. So the answer was always 0,
     the HUD never rose, and on all six vocabulary sheets the hotbar sat across
     the app's own bar and covered "Check my answers". getClientRects() is empty
     for a display:none element and has a rect for a fixed one, which is the
     question actually being asked. */
  function lift() {
    if (!cfg.lift || !hud) return;
    var t = document.querySelector(cfg.lift);
    var px = (t && t.getClientRects().length) ? t.offsetHeight : 0;
    cfg._liftpx = px;
    hud.style.setProperty("--mc-lift", px + "px");
  }

  function drawHearts() {
    if (!heartsEl) return;
    var out = "", i, v;
    for (i = 0; i < 10; i++) {
      v = Math.max(0, Math.min(2, halves - i * 2));
      out += '<img class="mc-heart" data-v="' + v + '" alt="" src="' +
             url(v === 2 ? "heart-full" : v === 1 ? "heart-half" : "heart-empty") + '">';
    }
    heartsEl.innerHTML = out;
  }

  /* Renders a mineral. The coloured block is CSS, so this works before any
     ore art exists; if the sprite is there it loads on top, and if it is not
     the broken image removes itself rather than showing a torn-page icon. */
  function oreChip(k, label, on) {
    var o = ORE_BY[k];
    return '<span class="mc-ore' + (on === false ? " mc-dim" : "") + '" title="' + o.name +
           '" style="--ore:' + o.hex + '">' +
           '<img alt="" src="' + url("ore-" + k) +
           '" onerror="this.parentNode.classList.add(\'mc-noart\');this.remove()">' +
           (label ? '<b>' + label + "</b>" : "") + "</span>";
  }

  /* A beacon slot. Earned slots show their block; an unearned one shows the
     plain stone stand-in, so the row reads as a pyramid under construction
     rather than as four mystery squares. Either falls back to a CSS block. */
  function blockChip(b) {
    var got = b.blocks >= 1;
    return '<span class="mc-blk' + (got ? "" : " mc-dim") + '" title="' + b.name +
           '" style="--ore:' + b.hex + '">' +
           '<img alt="" src="' + url(got ? "block-" + b.k : "block-locked") +
           '" onerror="this.parentNode.classList.add(\'mc-noart\');this.remove()">' +
           "<b>" + b.blocks + "/1</b></span>";
  }

  function drawBar() {
    if (!barEl) return;
    var out = "", i, on;
    for (i = 1; i <= 9; i++) {
      on = has(i);
      out += '<div class="mc-slot' + (i === lastNew ? " mc-new" : "") + '" data-n="' + i +
             '" style="background-image:url(' + url("slot") + ')" title="' +
             (on ? TOOLS[i - 1] : "locked") + '">' +
             '<img class="mc-frame" alt="" src="' + url("slot-frame") + '">' +
             (on ? '<img class="mc-tool" alt="' + TOOLS[i - 1] + '" src="' + url("tool-" + i) + '">' : "") +
             "</div>";
    }
    barEl.innerHTML = out;
  }

  /* ---------- sprite bursts ---------- */
  function burst(name, cls, narrow) {
    var old = document.querySelector(".mc-burst");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var d = document.createElement("div");
    d.className = "mc-burst " + cls;
    if (narrow) d.setAttribute("data-w", "narrow");
    d.innerHTML = '<img alt="" src="' + url(name) + '">';
    document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1600);
  }

  function shake() {
    if (!cfg.shake) return;                 // science already shakes its own card
    var t = document.querySelector(cfg.shake);
    if (!t) return;
    t.classList.remove("mc-shake");
    void t.offsetWidth;
    t.classList.add("mc-shake");
    setTimeout(function () { t.classList.remove("mc-shake"); }, 400);
  }

  /* ---------- public ---------- */
  var MC = {
    config: function (o) {
      for (var k in o) if (o.hasOwnProperty(k)) cfg[k] = o[k];
      if (document.body) build(); else
        document.addEventListener("DOMContentLoaded", build);
      /* The header this hangs off is further down the document than the config
         call, so it has to wait for the rest of the page even when body exists. */
      if (document.readyState === "loading")
        document.addEventListener("DOMContentLoaded", subjectLink);
      else subjectLink();
      return MC;
    },

    /* Entering a level. Pass {partial:true} for a correction round that
       replays only the missed items — those must not overwrite a best score
       or hand out the big rewards, since three words at 100% is not the same
       achievement as twelve. */
    begin: function (opts) {
      halves = 20; lastNew = 0;
      missedHere = {}; fixedHere = 0;
      partialRun = !!(opts && opts.partial);
      askPick = {};              // a new run gets new wordings
      build(); drawHearts(); drawBar(); fit();
    },

    /* Credit a fix without any fanfare. The vocabulary sheet settles 26 words
       on a single check — that is one burst, not twenty-six. */
    credit: function (missKey) {
      if (missKey && missedHere[missKey]) { fixedHere++; delete missedHere[missKey]; }
    },

    /* Pass the same key you passed to wrong()/note() and the correction is
       counted — that is what earns the comeback badge. */
    right: function (missKey) {
      build();
      MC.credit(missKey);
      goodN = goodN % 4 + 1;
      burst("win-" + goodN, "mc-good");
      play("correct");
    },

    /* Record a miss without any cost. Used where one action covers several
       items, or where the answer is revealed after the miss already landed. */
    note: function (missKey) {
      if (!missKey) return;
      missedHere[missKey] = true;
      var a = cfg.app;
      if (!S.misses[a]) S.misses[a] = {};
      S.misses[a][missKey] = (S.misses[a][missKey] || 0) + 1;
      save();
    },

    wrong: function (missKey) {
      build();
      badN = badN % 4 + 1;
      burst("bad-" + badN, "mc-bad", badN === 2 || badN === 4);
      shake();
      play("wrong");
      if (halves > 0) {
        halves--;                            // floors at zero — never a game over
        drawHearts();
        var i = Math.floor(halves / 2);
        var h = heartsEl && heartsEl.children[Math.min(9, i)];
        if (h) h.classList.add("mc-hit");
      }
      MC.note(missKey);
    },

    /* Records the score, may award a tool. Returns what happened so the
       results screen can talk about it. */
    /* Records the score, may award a tool, and works out what he earned.
       Every band is a real Minecraft tier, because every one of them is a
       tool you are glad to have — there is no booby prize here. */
    clear: function (id, pct, opts) {
      opts = opts || {};
      pct = Math.round(pct);
      var key = cfg.app + ":" + id;
      var prev = S.cleared[key];
      var before = unlocked();
      var got = null;

      /* Log the try itself before anything else, so it is recorded whether or
         not it counted towards the game. A partial run is marked rather than
         dropped: it is still practice a parent may want to see. */
      if (!S.runs[key]) S.runs[key] = [];
      var run = { p: pct, t: Date.now() };
      if (partialRun) run.x = 1;
      S.runs[key].push(run);
      if (S.runs[key].length > RUNS_KEPT) S.runs[key] = S.runs[key].slice(-RUNS_KEPT);
      save();

      if (!partialRun) {
        S.cleared[key] = Math.max(prev || 0, pct);
        if (key === "spelling:l7" && pct >= 75) S.tool9 = true;
        save();
        var after = unlocked();
        if (after.nine && !before.nine) got = 9;
        else if (after.count > before.count) got = after.count;
        lastNew = got || 0;
        if (got) play("tool");             // a new tool is the one thing worth a fanfare
        drawBar();
        drawHeroes();
      }

      var clean = pct >= 100 && halves === 20;
      var isBossLevel = cfg.dragon === null || cfg.dragon.indexOf(id) !== -1;
      /* The End portal stays shut until the whole tool set is his. A perfect
         run before that is still a perfect run — it just does not summon a
         dragon, and the chest says what is still missing rather than going
         quiet about it. */
      var ready = unlocked().all9;
      var dragon = clean && !partialRun && isBossLevel && ready;
      var portalShut = clean && !partialRun && isBossLevel && !ready;
      if (dragon) { S.dragon++; save(); }

      /* Coins, every run, from the very first one. Finishing at all is worth
         something — that is the floor, and it is deliberate: a child who had a
         bad round should still walk away holding more than he arrived with.
         Everything above the floor is earned. */
      var coins = 3;
      if (pct >= 75) coins += 3;
      if (pct >= 85) coins += 3;
      if (pct >= 95) coins += 4;
      if (pct >= 100) coins += 5;
      if (halves === 20) coins += 5;          // not a heart lost
      if (fixedHere) coins += 2 * fixedHere;  // fixing a miss pays, and it should
      if (dragon) coins += 40;
      if (partialRun) coins = Math.max(2, Math.round(coins / 2));
      S.coins += coins;
      S.earned += coins;
      save();
      drawCoins();

      /* What the run was worth at the rock face. Coal through gold repeat, so
         there is always something to dig; diamond is once per activity, so a
         pile of them needs breadth AND mastery; emerald comes only from the
         dragon. Nothing is mined at all until the tool set is complete. */
      var mined = [];
      function dig(k, n) {
        S.ore[k] = (S.ore[k] || 0) + n;
        mined.push({ k: k, n: n, name: ORE_BY[k].name, hex: ORE_BY[k].hex });
      }
      if (mineOpen()) {
        if (partialRun) {
          if (pct >= 100) dig("lapis", 1);            // every miss put right
        } else {
          if (pct >= 75) dig("coal", 1);
          if (pct >= 85) dig("copper", 1);
          if (pct >= 95) dig("iron", 1);
          if (pct >= 100) dig("gold", 1);
          if (pct >= 75 && halves === 20) dig("redstone", 1);
          if (clean && !S.gem[key]) { S.gem[key] = true; dig("diamond", 1); }
        }
        if (dragon) dig("emerald", 1);
        if (mined.length) save();
      }

      var tier;
      if (partialRun)   tier = ["CORRECTIONS", "You went back and fixed them. That is the part that sticks."];
      else if (dragon)  tier = ["DRAGON SLAIN", "Perfect. Not one miss, not one heart."];
      else if (clean)   tier = ["NETHERITE", "Every single one right."];
      else if (pct >= 90) tier = ["DIAMOND", "So close to flawless."];
      else if (pct >= 75) tier = ["IRON", "Solid work \u2014 this one is holding."];
      else if (pct >= 50) tier = ["STONE", "You got through it. Now you know where to dig."];
      else                tier = ["WOOD", "You finished it, and that is where everyone starts."];

      /* Badges stack. They reward things accuracy alone does not see. */
      var badges = [];
      if (fixedHere)
        badges.push(fixedHere === 1 ? "TURNED ONE AROUND" : "TURNED " + fixedHere + " AROUND");
      if (!partialRun && prev != null && pct > prev)
        badges.push("NEW BEST \u2014 BEAT " + prev + "%");
      if (!partialRun && (prev == null || prev < 75) && pct >= 75)
        badges.push("FIRST CLEAR");
      if (halves > 0 && halves <= 4 && pct >= 50)
        badges.push("STUCK IT OUT");

      var bea = null;
      if (mineOpen()) {
        bea = { lit: beaconLit(), need: [] };
        for (var bi = 0; bi < BEACON.length; bi++)
          bea.need.push({ k: BEACON[bi], have: oreCount(BEACON[bi]),
                          blocks: blocks(BEACON[bi]), name: ORE_BY[BEACON[bi]].name,
                          hex: ORE_BY[BEACON[bi]].hex });
      }

      return {
        mined: mined, beacon: bea, portalShut: portalShut,
        toolsLeft: (8 - unlocked().count) + (S.tool9 ? 0 : 1),
        mineOpen: mineOpen(), dragons: S.dragon,
        tool: got,
        toolName: got ? TOOLS[got - 1] : null,
        loot: halves >= 20 ? 4 : halves >= 15 ? 3 : halves >= 8 ? 2 : 1,
        hearts: halves / 2,
        fixed: fixedHere,
        partial: partialRun,
        tier: tier[0], blurb: tier[1], badges: badges,
        boss: dragon
      };
    },

    /* Paints chest-closed, then opens it on tap or after a beat. */
    chest: function (host, pct, opts) {
      if (!host) return null;
      var r = MC.clear(opts.id, pct, opts);
      var box = document.createElement("div");
      box.className = "mc-chest";
      box.innerHTML = '<img class="mc-lid mc-shut" alt="Closed chest" src="' + url("chest-closed") + '">' +
                      '<div class="mc-loot"></div>' +
                      '<div class="mc-tier"></div>' +
                      '<div class="mc-cap">Tap the chest</div>';
      host.insertBefore(box, host.firstChild);
      var lid = box.querySelector(".mc-lid"),
          loot = box.querySelector(".mc-loot"),
          tierEl = box.querySelector(".mc-tier"),
          cap = box.querySelector(".mc-cap"),
          opened = false;

      function open() {
        if (opened) return;
        opened = true;
        lid.classList.remove("mc-shut");
        lid.src = url("chest-open");
        flourish(box);   /* whatever he has on: sparkle by default, bought if bought */
        lid.alt = "Open chest";
        lid.style.cursor = "default";
        var html = "", i;
        for (i = 1; i <= r.loot; i++) html += '<img alt="" src="' + url("win-" + i) + '">';
        loot.innerHTML = html;
        tierEl.textContent = r.tier;
        tierEl.setAttribute("data-t", r.tier.split(" ")[0].toLowerCase());
        cap.textContent = r.blurb;
        if (r.badges.length) {
          box.insertAdjacentHTML("beforeend", '<div class="mc-badges">' +
            r.badges.map(function (b) { return '<span class="mc-badge">' + b + "</span>"; })
              .join("") + "</div>");
        }
        if (r.tool) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-earned"><img alt="" src="' + url("tool-" + r.tool) + '">' +
            "<span>NEW &middot; " + r.toolName.toUpperCase() + "</span></div>");
        }
        if (r.mined && r.mined.length) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-haul"><span class="mc-haullab">MINED</span>' +
            r.mined.map(function (m) { return oreChip(m.k, "+" + m.n); }).join("") +
            "</div>");
        }
        if (r.portalShut) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-shutportal"><img class="mc-portal" alt="" src="' + url("portal") +
            '" onerror="this.remove()">THE PORTAL WILL NOT OPEN<small>A perfect run \u2014 ' +
            'but the End stays shut until all nine tools are yours. ' +
            (r.toolsLeft === 1 ? "One to go." : r.toolsLeft + " to go.") + "</small></div>");
        }
        if (r.beacon) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-beacon' + (r.beacon.lit ? " mc-lit" : "") + '">' +
            '<span class="mc-haullab">' + (r.beacon.lit ? "BEACON LIT" : "BEACON") + "</span>" +
            r.beacon.need.map(function (b) { return blockChip(b); }).join("") +
            "<small>" + (r.beacon.lit
              ? "Iron, gold, diamond and emerald, a block of each. That is the whole pyramid."
              : "Nine of a mineral makes a block. Four blocks light the beacon.") +
            "</small></div>");
        }
        if (!r.boss && r.dragons > 0 && r.mineOpen) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-egg"><img alt="" src="' + url("dragon-egg") +
            '" onerror="this.remove()"><span>' +
            (r.dragons === 1 ? "One dragon down" : r.dragons + " dragons down") +
            "</span></div>");
        }
        if (r.boss) {
          box.insertAdjacentHTML("beforeend", HAS_BOSS
            ? '<img class="mc-boss" alt="Ender dragon defeated" src="' + url("boss-defeated") + '">'
            : '<div class="mc-bossfall">DRAGON SLAIN<small>Perfect run \u2014 no misses, no hearts lost</small></div>');
        }
      }
      lid.addEventListener("click", open);
      setTimeout(open, 2600);                // opens itself if he doesn't tap
      return r;
    },

    /* Best score per activity for THIS app, keyed by bare id — lets an app's
       level picker show scores that survive a reload. The apps each kept their
       own in-memory `best` object, which forgot everything on refresh. */
    bests: function () {
      var out = {}, pre = cfg.app + ":", k;
      for (k in S.cleared) if (k.indexOf(pre) === 0) out[k.slice(pre.length)] = S.cleared[k];
      return out;
    },

    /* A strip of level chips, each showing whether it has been cleared.
       Reusable: any app with several parallel levels calls this rather than
       rolling its own, so history, and anything added later, look the same.

         MC.picker(hostEl, [{id:"set0", label:"1"}, ...], currentId, onPick)

       Chips colour themselves from MC.bests(): green cleared, amber attempted,
       plain untouched. Re-call it to repaint after a score changes. */
    picker: function (host, items, current, onPick) {
      if (!host) return;
      var best = MC.bests();
      host.className = "mc-picker";
      host.innerHTML = items.map(function (it) {
        var b = best[it.id];
        var cls = b == null ? "" : (b >= 75 ? " mc-cleared" : " mc-tried");
        if (it.id === current) cls += " mc-now";
        return '<button type="button" class="mc-chip' + cls + '" data-id="' + it.id +
               '" aria-pressed="' + (it.id === current) + '"' +
               ' title="' + (b == null ? "not tried yet" : "best " + b + "%") + '">' +
               '<span class="mc-chip-l">' + it.label + "</span>" +
               '<span class="mc-chip-s">' + (b == null ? "&mdash;" : b + "%") + "</span>" +
               "</button>";
      }).join("");
      var bs = host.querySelectorAll(".mc-chip");
      for (var i = 0; i < bs.length; i++) {
        bs[i].addEventListener("click", function () {
          onPick(this.getAttribute("data-id"));
        });
      }
    },

    state: function () {
      var u = unlocked();
      return {
        tools: u, toolNames: TOOLS,
        ore: JSON.parse(JSON.stringify(S.ore)), oreKinds: ORE,
        mineOpen: mineOpen(), dragons: S.dragon,
        coins: S.coins, earned: S.earned,
        owned: JSON.parse(JSON.stringify(S.owned)),
        equip: JSON.parse(JSON.stringify(S.equip)),
        gate: TOOL_GATE, elytraNeeds: ELYTRA_SUBJECTS,
        subjectsCleared: subjectsCleared(),
        gems: JSON.parse(JSON.stringify(S.gem)),
        beacon: { needs: BEACON, lit: beaconLit(),
                  blocks: BEACON.map(function (k) { return blocks(k); }) },
        cleared: JSON.parse(JSON.stringify(S.cleared)),
        misses: JSON.parse(JSON.stringify(S.misses)),
        runs: JSON.parse(JSON.stringify(S.runs)),
        url: url
      };
    },

    /* Every attempt at one activity, oldest first. The hub's report reads this;
       apps do not need it. */
    runs: function (id) {
      var key = cfg.app + ":" + id;
      return (S.runs[key] || []).slice();
    },

    /* The wording to ask a question in.

       An item may carry `qv`, a few phrasings of the same question. One is
       chosen per run, so a second attempt at the same set does not read like a
       memory test of the first — but it is fixed for the length of that run, so
       the review screen shows the wording he was actually asked rather than a
       third one. Items without `qv` just return `q`.

       Options are already re-shuffled on every render; this is the same idea
       applied to the stem. */
    ask: function (it) {
      if (!it) return "";
      var v = it.qv;
      if (!v || !v.length) return it.q;
      if (it.__mcq === undefined) it.__mcq = ++askSeq;
      if (askPick[it.__mcq] === undefined)
        askPick[it.__mcq] = (Math.random() * v.length) | 0;
      return v[askPick[it.__mcq]];
    },

    /* Sound off/on. Kept in the same saved state as everything else, so the
       choice holds across every app and survives a reload. Call with no
       argument to read it. */
    mute: function (on) {
      if (on === undefined) return !!S.mute;
      S.mute = !!on;
      save();
      drawMute();
      return S.mute;
    },

    /* ---------- the shop ----------
       The catalogue lives in store/index.html, because what is for sale is
       content and this is the engine. All the engine owns is the money and the
       fact of ownership. */

    /* Draws the character into `host` and keeps it up to date. `title` is
       whatever the page wants written under it — the rank, usually. */
    hero: function (host, title) {
      if (!host) return;
      heroHosts.push({ node: host, title: title || "" });
      host.innerHTML = heroHTML(title || "");
    },

    /* Drop everything recorded about one app: its scores, its run history and
       its miss log. For use when a grading fault means the numbers cannot be
       trusted — there is no way to recompute a score after the fact, because
       what was chosen is not kept, only the total.

       Coins, tools, ore and anything worn are untouched. Those are not in
       doubt, and nothing earned is ever taken away. */
    forget: function (app) {
      if (!app) return 0;
      var gone = 0, k;
      for (k in S.cleared) if (k.indexOf(app + ":") === 0) { delete S.cleared[k]; gone++; }
      for (k in S.runs) if (k.indexOf(app + ":") === 0) delete S.runs[k];
      for (k in S.misses) if (k.indexOf(app + "-") === 0 || k.indexOf(app + ":") === 0) delete S.misses[k];
      for (k in S.gem) if (k.indexOf(app + ":") === 0) delete S.gem[k];
      if (gone) { save(); drawBar(); drawHeroes(); }
      return gone;
    },

    earned: function () { return S.earned; },

    owns: function (id) { return !!S.owned[id]; },

    /* Buys once and keeps it. Refuses rather than going overdrawn, and refuses
       a second purchase of something already owned, so a double tap on a slow
       connection cannot charge twice. */
    buy: function (id, cost) {
      cost = Math.max(0, Math.round(Number(cost) || 0));
      if (!id || S.owned[id]) return false;
      if (S.coins < cost) return false;
      S.coins -= cost;
      S.owned[id] = true;
      save();
      drawCoins();
      drawHeroes();
      return true;
    },

    /* Wearing costs nothing and can be undone. Passing null takes the slot back
       to its default, so nothing bought can ever strand him in a look he has
       gone off. Refuses to equip something not owned. */
    equip: function (slot, id) {
      if (!slot) return false;
      if (id && !S.owned[id]) return false;
      if (id) S.equip[slot] = id; else delete S.equip[slot];
      save();
      skin();
      drawHeroes();
      return true;
    },

    equipped: function (slot) { return S.equip[slot] || null; },

    reset: function () {
      S = { cleared: {}, misses: {}, tool9: false, ore: {}, gem: {}, dragon: 0,
            runs: {}, coins: 0, earned: 0, owned: {}, equip: {},
            mute: S.mute };  // muting is a preference, not progress
      save(); drawBar(); drawCoins(); skin(); drawHeroes();
    },
    _relift: lift
  };

  skin();

  window.MC = MC;
})();
</script>
