<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saxon Course 2 practice</title>
<style>
:root{
  --bg:#0B1A18; --panel:#F4F1E9; --panel-2:#E8E3D6; --ink:#1A211F; --dim:#6E7A76;
  --gold:#E0A83C; --stone:#8A9490; --jade:#2F8F76; --red:#C4553F; --sky:#3D82B8;
  --line:#D6CFBE; --paper:#F4F1E9;
  --disp:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--body);
  line-height:1.55;padding:0 0 96px;
  background-image:radial-gradient(circle at 12% -6%,#153029 0%,transparent 55%)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.hide{display:none !important}

.hublink{display:inline-block;margin:16px 14px 0 0;font:700 12px var(--mono);
  letter-spacing:.07em;color:var(--gold);text-decoration:none}
.hublink:hover{text-decoration:underline}
.hublink.quiet{color:var(--stone)}

.eyebrow{font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--stone);margin:22px 0 6px}
h1{font-family:var(--disp);font-size:clamp(26px,7vw,38px);line-height:1.05;
  margin:0 0 8px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
.lede{margin:0 0 6px;color:#C9D2CE;font-size:15px;max-width:54ch}

/* ---------- decades ---------- */
.decade{margin:12px 0 0;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03)}
.decade > summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;
  align-items:center;gap:12px}
.decade > summary::-webkit-details-marker{display:none}
.decade h2{margin:0;font-family:var(--disp);font-size:17px;flex:1}
.decade .tally{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--stone);white-space:nowrap}
.decade .caret{width:18px;height:18px;flex:none;color:var(--stone);transition:transform .15s}
.decade[open] .caret{transform:rotate(90deg)}
.decade[open] > summary{border-bottom:1px solid rgba(255,255,255,.12)}
.lessons{list-style:none;margin:0;padding:6px}
.lessons li{margin:0}
.lrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  width:100%;text-align:left;padding:10px 10px;background:none;border:0;color:inherit;
  font:inherit;cursor:pointer;border-radius:2px}
.lrow:hover{background:rgba(255,255,255,.06)}
.lrow[disabled]{cursor:default;opacity:.42}
.lrow[disabled]:hover{background:none}
.lnum{width:34px;height:34px;flex:none;display:grid;place-items:center;
  background:var(--panel-2);color:var(--ink);font:800 14px var(--mono);
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.lrow.saved .lnum{background:var(--gold)}
.lwhat{min-width:0}
.lwhat b{display:block;font:600 15px var(--body)}
.lwhat small{display:block;font-size:12.5px;color:var(--stone)}
.lgo{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);white-space:nowrap}
.lrow[disabled] .lgo{color:var(--stone)}

/* ---------- the picker ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,12,11,.86);
  display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px 12px}
.sheet{width:100%;max-width:620px;background:var(--panel);color:var(--ink);
  border:2px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.55)}
.shead{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-family:var(--disp);font-size:19px}
.shead p{margin:3px 0 0;font-size:13px;color:var(--dim)}
.sx{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;
  color:var(--dim);cursor:pointer;padding:0 2px}
.sx:hover{color:var(--ink)}
.stools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--panel-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;
  padding:12px 16px;max-height:46vh;overflow:auto}
.pk{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);
  background:#fff;cursor:pointer;user-select:none}
.pk.on{border-color:var(--jade);background:#EAF6F1}
.pk.off{opacity:.45;cursor:default;background:var(--panel-2)}
.pk input{margin:0;width:16px;height:16px;flex:none;accent-color:var(--jade)}
.pk .n{font:800 13px var(--mono);min-width:20px}
.pk .s{font-size:11px;color:var(--dim);line-height:1.25;min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .howmany{display:flex;gap:2px}
.pk .howmany button{width:20px;height:20px;padding:0;border:1px solid var(--line);
  background:#fff;font:700 11px var(--mono);color:var(--dim);cursor:pointer}
.pk .howmany button.sel{background:var(--jade);border-color:var(--jade);color:#fff}
.pk.off .howmany{visibility:hidden}
.sfoot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);
  background:var(--panel-2);flex-wrap:wrap}
.sfoot .count{font:700 12px var(--mono);color:var(--dim);flex:1;min-width:120px}

/* ---------- the run ---------- */
.dots{display:flex;gap:4px;margin:16px 0 10px;flex-wrap:wrap}
.dot{width:9px;height:9px;background:rgba(255,255,255,.2)}
.dot.done{background:var(--jade)}
.dot.now{background:var(--gold)}
.card{background:var(--panel);color:var(--ink);border:2px solid var(--line);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.22);padding:16px}
.qnum{font:700 10.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px}
.qsrc{font:700 10.5px var(--mono);letter-spacing:.06em;color:var(--jade);margin-bottom:8px}
.q{font-size:17px;line-height:1.45;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:11px 12px;background:#fff;border:2px solid var(--line);cursor:pointer;
  font:inherit;font-size:15px;color:var(--ink)}
.opt:hover{border-color:var(--stone)}
.opt.sel{border-color:var(--sky);background:#EAF2F8}
.opt.right{border-color:var(--jade);background:#EAF6F1}
.opt.wrong{border-color:var(--red);background:#F8ECEA}
.opt .k{font:800 12px var(--mono);color:var(--dim);flex:none;width:15px;padding-top:2px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:800 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:9px 15px;border:2px solid var(--ink);background:var(--gold);color:#26210F;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.3);cursor:pointer}
.btn:hover:not([disabled]){filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.o:hover{border-color:var(--ink)}
.btn.dark{background:transparent;color:var(--gold);border-color:var(--gold)}
.fb{margin-top:14px;padding:12px 13px;font-size:14.5px;line-height:1.55}
.fb.yes{background:#EAF6F1;border-left:4px solid var(--jade)}
.fb.no{background:#F8ECEA;border-left:4px solid var(--red)}
.fb cite{display:block;font:600 11px var(--mono);color:var(--stone);margin-top:8px;font-style:normal}
.nav{display:flex;align-items:center;gap:10px;margin-top:16px}
.navb{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  padding:8px 13px;background:transparent;border:2px solid rgba(255,255,255,.2);
  color:var(--paper);cursor:pointer}
.navb:hover:not([disabled]){border-color:var(--gold);color:var(--gold)}
.navb[disabled]{opacity:.35;cursor:default}
.navpos{flex:1;text-align:center;font:700 11px var(--mono);letter-spacing:.1em;color:var(--stone)}
.skipnote{margin:12px 0 0;padding:12px 13px;background:rgba(224,168,60,.12);
  border-left:4px solid var(--gold);font-size:14px;line-height:1.55}

/* ---------- the worked example ---------- */
.readbox{position:fixed;inset:0;z-index:55;background:rgba(6,12,11,.86);
  display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px 12px}
.readbox[hidden]{display:none}
.readinner{width:100%;max-width:620px;background:var(--panel);color:var(--ink);
  border:2px solid var(--line);padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.readhead{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);
  padding-bottom:10px;margin-bottom:12px}
.readtitle{font-family:var(--disp);font-size:18px}
.readcite{font:600 11px var(--mono);color:var(--stone);margin-top:2px}
.readx{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;
  color:var(--dim);cursor:pointer}
.readbody p{margin:0 0 10px;font-size:14.5px;line-height:1.62}
.readvocab{margin-top:12px;padding:11px 12px;background:var(--panel-2);border:1px solid var(--line)}
.vlab{font:800 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px}
.readvocab p{margin:0 0 6px;font-size:13.5px;line-height:1.5}
.readvocab i{color:var(--dim)}
.readbody mark.hl,.readvocab mark.hl{background:#FFF1B8;box-shadow:0 0 0 2px #FFF1B8;
  color:inherit;border-radius:2px}
.readbook{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--gold);
  background:rgba(224,168,60,.1);font-size:13.5px;line-height:1.55;color:var(--dim)}

/* ---------- the end ---------- */
.score{background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:18px;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.22)}
.ring{font:800 42px var(--mono);line-height:1}
.band{font:800 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.stats{display:flex;gap:22px;margin:14px 0 4px;flex-wrap:wrap}
.stat b{display:block;font:800 19px var(--mono)}
.stat span{font:700 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.missed{margin:14px 0 0;padding:12px 13px;background:var(--panel-2);border:1px solid var(--line);
  font-size:14px;line-height:1.6}
footer{margin:38px 0 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);
  font-size:12.5px;color:var(--stone);line-height:1.6}
</style>
<!-- MC-THEME-CSS: generated by build_theme.py, do not hand-edit -->
<style>
/* ===== Minecraft theme layer — shared source, injected into all apps =====
   Everything is prefixed .mc- / #mc- so it cannot collide with app CSS.
   z-index budget in the apps: content < 30, HUD 30, scrim 40, drawer 50.
   Sprite bursts sit at 60 so they play over an auto-opening drawer.        */

.mc-hud{
  position:fixed; left:0; right:0; z-index:30;
  bottom:var(--mc-lift, 0px);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  pointer-events:none;
  background:linear-gradient(to top, rgba(0,0,0,.42), rgba(0,0,0,0));
  transition:bottom .18s;
}
.mc-hud img{image-rendering:pixelated; display:block}

.mc-hearts{
  display:flex; gap:1px; align-self:center;
  width:var(--mc-barw, 360px); box-sizing:border-box;
}
.mc-heart{width:var(--mc-hh,19px); height:auto}
/* heart-empty is very faint on dark art — read the row as sockets waiting */
.mc-heart[data-v="0"]{filter:drop-shadow(0 0 2px rgba(255,255,255,.5)) drop-shadow(0 0 5px rgba(0,0,0,.6)); opacity:.85}
.mc-heart.mc-hit{animation:mc-hit .42s}
@keyframes mc-hit{
  0%{transform:scale(1.55)} 25%{transform:scale(1.1) rotate(-8deg)}
  55%{transform:scale(1.25)} 100%{transform:none}
}

.mc-bar{display:flex; gap:0; width:var(--mc-barw,360px); box-sizing:border-box}
.mc-slot{
  position:relative; width:var(--mc-ss,38px); height:var(--mc-ss,38px);
  flex:0 0 auto; background-size:100% 100%; background-repeat:no-repeat;
}
.mc-slot .mc-tool{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:69%; height:69%; object-fit:contain;
}
/* tool-9 already has zero side margin in the source art — don't scale it up */
.mc-slot[data-n="9"] .mc-tool{width:62%; height:62%}
.mc-slot .mc-frame{position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px); opacity:0}
.mc-slot.mc-new .mc-frame{opacity:1; animation:mc-pulse 1.1s ease-in-out 3}
.mc-slot.mc-new .mc-tool{animation:mc-drop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes mc-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes mc-drop{from{transform:translate(-50%,-160%) scale(.4); opacity:0}}

/* ---- sprite burst ---- */
.mc-burst{
  position:fixed; left:50%; top:44%; z-index:60; pointer-events:none;
  width:var(--mc-burst,128px); height:var(--mc-burst,128px);
  transform:translate(-50%,-50%);
}
.mc-burst img{width:100%; height:100%; object-fit:contain; image-rendering:pixelated}
.mc-burst.mc-good{animation:mc-good 1.35s cubic-bezier(.18,1.3,.4,1) forwards}
.mc-burst.mc-bad{animation:mc-bad 1.15s ease-out forwards}
/* bad-2 creeper and bad-4 zombie carry ~30px of side margin; TNT and the
   spider fill the frame. Nudge the narrow two up so misses land evenly. */
.mc-burst.mc-bad[data-w="narrow"] img{transform:scale(1.17)}
@keyframes mc-good{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg); opacity:0}
  18%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg); opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1}
  72%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1}
  100%{transform:translate(-50%,-80%) scale(1.05); opacity:0}
}
@keyframes mc-bad{
  0%{transform:translate(-50%,-50%) scale(.55); opacity:0}
  14%{transform:translate(-50%,-50%) scale(1.08); opacity:1}
  26%{transform:translate(-50%,-50%) scale(1); opacity:1}
  74%{transform:translate(-50%,-50%) scale(1); opacity:1}
  100%{transform:translate(-50%,-44%) scale(.96); opacity:0}
}

.mc-shake{animation:mc-shake .34s}
@keyframes mc-shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}

/* ---- results chest ---- */
.mc-chest{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:14px 10px 4px; margin:2px 0 6px;
  position:relative;   /* the victory flourish anchors to the chest */
}
.mc-chest .mc-lid{width:120px; height:120px; object-fit:contain; image-rendering:pixelated;
  transition:transform .2s; cursor:pointer}
.mc-chest .mc-lid.mc-shut{animation:mc-nudge 1.5s ease-in-out infinite}
@keyframes mc-nudge{0%,88%,100%{transform:none}92%{transform:translateY(-4px) rotate(-2deg)}96%{transform:translateY(-2px) rotate(2deg)}}
.mc-loot{display:flex; gap:6px; justify-content:center; min-height:4px; flex-wrap:wrap}
.mc-loot img{width:52px; height:52px; object-fit:contain; image-rendering:pixelated;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.mc-loot img:nth-child(2){animation-delay:.09s}
.mc-loot img:nth-child(3){animation-delay:.18s}
.mc-loot img:nth-child(4){animation-delay:.27s}
.mc-loot img:nth-child(5){animation-delay:.36s}
@keyframes mc-pop{from{transform:translateY(26px) scale(.3); opacity:0}}
.mc-tier{
  font:800 19px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.1em;
  text-align:center; margin-top:2px;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) .3s both;
}
.mc-tier[data-t="dragon"]{color:#A855C8}
.mc-tier[data-t="netherite"]{color:#6B5A6E}
.mc-tier[data-t="diamond"]{color:#2AA7B8}
.mc-tier[data-t="iron"]{color:#8A8A8A}
.mc-tier[data-t="stone"]{color:#7A7A7A}
.mc-tier[data-t="wood"]{color:#9A6B3F}
.mc-tier[data-t="corrections"]{color:#4A8230}
.mc-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.mc-badge{
  font:800 10.5px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.07em;
  background:#F0E6CF; color:#5A4A2E; border:2px solid #C7B48C; padding:4px 8px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.12), inset 2px 2px 0 rgba(255,255,255,.5);
  animation:mc-pop .45s cubic-bezier(.2,1.6,.4,1) both;
}
.mc-badge:nth-child(2){animation-delay:.1s}
.mc-badge:nth-child(3){animation-delay:.2s}
.mc-cap{
  font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em;
  text-transform:uppercase; opacity:.72; text-align:center;
}
.mc-earned{
  display:flex; align-items:center; gap:9px; justify-content:center;
  font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;
  animation:mc-pop .5s cubic-bezier(.2,1.6,.4,1) .45s both;
}
.mc-earned img{width:38px; height:38px; object-fit:contain; image-rendering:pixelated}

.mc-boss{width:100%; max-width:256px; height:auto; image-rendering:pixelated;
  animation:mc-pop .6s cubic-bezier(.2,1.5,.4,1) .3s both}
/* fallback while boss-defeated.png is still outstanding */
.mc-bossfall{
  width:100%; max-width:280px; border-radius:12px; padding:13px 14px; text-align:center;
  background:linear-gradient(140deg,#1D1526,#3A1F2E); color:#FFD98A;
  border:2px solid #6B4A2E; box-shadow:0 6px 0 rgba(0,0,0,.25);
  font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.05em;
  animation:mc-pop .6s cubic-bezier(.2,1.5,.4,1) .3s both;
}
.mc-bossfall small{display:block; font-size:11px; opacity:.7; margin-top:4px; letter-spacing:.03em}

@media (prefers-reduced-motion:reduce){
  .mc-burst.mc-good,.mc-burst.mc-bad{animation-duration:.8s}
  .mc-shake{animation:none}
  .mc-chest .mc-lid.mc-shut{animation:none}
}

/* ---- level-picker status ----
   The apps' own .badge sat in the bottom-right corner of a tall card, so
   checking seven levels meant scanning seven different corners. Moved to the
   top-right, level with each card's eyebrow, which gives one straight vertical
   line to run your eye down. These sit later in the cascade at equal
   specificity, so they win without editing app CSS. */
.mc-best{
  top:11px !important; right:12px !important; bottom:auto !important;
  background:#E8A93C !important; color:#3A2A08 !important;
  font-weight:800 !important; letter-spacing:.04em; white-space:nowrap;
  padding:4px 9px !important; border-radius:3px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.16), inset 2px 2px 0 rgba(255,255,255,.35);
}
.mc-best.mc-done{background:#63A93E !important; color:#0F2216 !important}
/* and mark the card itself, so status is legible even mid-scroll */
.mc-cleared{box-shadow:inset 0 0 0 3px #63A93E !important}
.mc-tried{box-shadow:inset 0 0 0 3px #E8A93C !important}

/* ---- level chips (MC.picker) ----
   For apps whose levels are parallel and equally valid — history's five
   practice sets — so you can see and choose, not just be dealt one. */
.mc-picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.mc-chip{
  flex:1 1 auto; min-width:56px; min-height:44px; padding:5px 8px;
  border:2px solid #C7B48C; background:#F0E6CF; color:#5A4A2E; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.14), inset 2px 2px 0 rgba(255,255,255,.5);
}
.mc-chip:hover{filter:brightness(1.05)}
.mc-chip:focus-visible{outline:3px solid #63A93E;outline-offset:2px}
.mc-chip-l{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.mc-chip-s{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.7}
.mc-chip.mc-cleared{background:#63A93E;border-color:#3F7028;color:#0F2216}
.mc-chip.mc-tried{background:#E8A93C;border-color:#B07E18;color:#3A2A08}
.mc-chip.mc-now{box-shadow:inset -2px -2px 0 rgba(0,0,0,.14),
  inset 2px 2px 0 rgba(255,255,255,.5), 0 0 0 3px #2B79C2}

/* ---------- the mine ---------- */
.mc-ore{display:inline-flex;align-items:center;gap:5px;margin:3px 5px 3px 0;
  font:800 11px ui-monospace,"SF Mono",Consolas,monospace;color:#E8E3D6}
.mc-ore img{width:22px;height:22px;image-rendering:pixelated;display:block}
.mc-ore.mc-noart::before{content:"";width:20px;height:20px;background:var(--ore);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.34), inset 3px 3px 0 rgba(255,255,255,.22);
  border:2px solid rgba(0,0,0,.45)}
.mc-ore b{font-weight:800}
.mc-ore.mc-dim{opacity:.42}
.mc-haul,.mc-beacon{margin-top:10px;padding:9px 11px;background:rgba(0,0,0,.26);
  border:2px solid rgba(255,255,255,.10);text-align:left}
.mc-haullab{display:block;font:800 9.5px ui-monospace,Consolas,monospace;
  letter-spacing:.14em;color:#9FB0AA;margin-bottom:5px}
.mc-beacon small,.mc-shutportal small{display:block;margin-top:6px;
  font:600 11px system-ui,sans-serif;color:#9FB0AA;line-height:1.45}
.mc-beacon.mc-lit{border-color:#40D5D1;
  box-shadow:0 0 0 2px rgba(64,213,209,.22), 0 0 22px rgba(64,213,209,.28)}
.mc-shutportal{margin-top:10px;padding:10px 12px;background:#160E22;
  border:2px solid #4B2E73;color:#C9A6F0;text-align:left;
  font:800 11.5px ui-monospace,Consolas,monospace;letter-spacing:.1em}

.mc-blk{display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  margin:4px 9px 2px 0;font:800 10px ui-monospace,Consolas,monospace;color:#C4CFCB}
.mc-blk img{width:34px;height:34px;image-rendering:pixelated;display:block}
.mc-blk.mc-noart::before{content:"";width:30px;height:30px;background:var(--ore);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.34),inset 4px 4px 0 rgba(255,255,255,.22);
  border:2px solid rgba(0,0,0,.45)}
.mc-blk.mc-dim img{filter:grayscale(.15) brightness(.8)}
.mc-blk.mc-dim{opacity:.75;color:#7C8A85}
.mc-portal{float:right;width:46px;height:46px;margin:-2px 0 0 10px;image-rendering:pixelated;
  filter:grayscale(1) brightness(.6)}
.mc-egg{margin-top:10px;padding:8px 11px;background:rgba(0,0,0,.26);
  border:2px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:9px;
  font:800 10.5px ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#C9A6F0}
.mc-egg img{width:30px;height:30px;image-rendering:pixelated}

/* The purse, top-left of the HUD, opposite the sound switch. */
.mc-purse{position:absolute;left:calc(8px + env(safe-area-inset-left));
  bottom:calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:5px;pointer-events:none;
  padding:3px 8px 3px 5px;border:2px solid #0D0D0F;background:rgba(20,20,22,.82);
  font:800 13px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#FCFC54}
.mc-coin{width:17px;height:17px;display:block;image-rendering:pixelated}
/* stands in until the coin sprite exists, so this works before the art lands */
.mc-coin-fb{border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFE27A,#E0A83C 62%,#9C6F1E);
  border:2px solid #6E4B10;box-shadow:inset -2px -2px 0 rgba(0,0,0,.28)}
@media (max-width:400px){.mc-purse{font-size:12px;padding:2px 6px 2px 4px}
  .mc-coin{width:15px;height:15px}}

/* MC-TOGGLE-CSS-START — the hub borrows everything between these two
   markers, because it has its own stylesheet and needs only this control. */
/* The sound toggle: a real switch rather than a lettered button, so its state
   reads without being learned. Blocky border, hard inner bevel and the grass
   green of the banner, so it belongs to the same world as the hotbar. */
.mc-mute{
  position:fixed; z-index:60;
  top:calc(10px + env(safe-area-inset-top));
  right:calc(10px + env(safe-area-inset-right));
  display:flex; align-items:center; gap:7px;
  padding:5px 9px 5px 6px; border:3px solid #0D0D0F; background:#1F1F23;
  cursor:pointer; opacity:.94;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.06),
             0 3px 0 rgba(0,0,0,.35);
}
.mc-mute:hover{opacity:1}
.mc-mute:active{transform:translateY(2px); box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),
             inset 3px 3px 0 rgba(255,255,255,.06)}
.mc-mute:focus-visible{opacity:1; outline:3px solid #FCFC54; outline-offset:2px}

/* the track */
.mc-sw{
  position:relative; flex:none; width:50px; height:26px;
  background:#63A93E; border:3px solid #0D0D0F;
  box-shadow:inset 2px 2px 0 rgba(0,0,0,.28);
  transition:background .16s steps(2);
}
.mc-mute.off .mc-sw{background:#5A5A60}

/* the knob, carrying the speaker */
.mc-knob{
  position:absolute; top:-1px; left:22px; width:22px; height:22px;
  display:grid; place-items:center;
  background:#E9E6DE; color:#141416; border:2px solid #0D0D0F;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.22);
  transition:left .16s steps(3);
}
.mc-mute.off .mc-knob{left:-1px; background:#B9B5AC; color:#2A2A2E}
.mc-spk{width:15px; height:15px; display:block}

.mc-lbl{
  font:800 11px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:.1em; color:#63A93E; min-width:2.2em; text-align:left;
}
.mc-mute.off .mc-lbl{color:#8E8A82}

@media (max-width:420px){
  .mc-mute{gap:5px; padding:4px 7px 4px 5px}
  .mc-sw{width:42px; height:23px}
  .mc-knob{width:19px; height:19px; left:18px}
  .mc-spk{width:13px; height:13px}
  .mc-lbl{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  .mc-sw,.mc-knob{transition:none}
}
/* MC-TOGGLE-CSS-END */

/* MC-SKIN-CSS-START */
/* ===== what he is wearing ===================================================
   The engine stamps these on <html> as it loads, before first paint.
   The attribute selector outranks an app's own :root whichever order the
   stylesheets landed in. Overworld is the default and needs no rule. */

html[data-mc-theme="deepslate"]{
  --bg:#14171A; --gold:#93A7BC;
  --mc-glow:#23272E;
}
html[data-mc-theme="cherry"]{
  --bg:#2A1622; --gold:#F0A2BE;
  --mc-glow:#46203A;
}
html[data-mc-theme="nether"]{
  --bg:#1E0C0B; --gold:#FF9247;
  --mc-glow:#3F1512;
}
html[data-mc-theme="end"]{
  --bg:#0E0A18; --gold:#CFBAFF;
  --mc-glow:#241A3A;
}
/* The apps paint their own radial wash from a hard-coded colour, so a themed
   page re-paints it from the token. Bare :root keeps the original. */
html[data-mc-theme]:not([data-mc-theme="overworld"]) body{
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12% -6%, var(--mc-glow) 0%, transparent 55%);
}

/* ---------- the purse he carries ---------- */
.mc-purse{transition:box-shadow .2s, border-color .2s}
/* The hub runs with the HUD off and paints its own coin badge, so each skin
   names both. Without this, a bought purse is invisible on the one page he
   looks at most. */
html[data-mc-purse="gold"] .purselink,
html[data-mc-purse="gold"] .mc-purse{
  border-color:#E0A83C; box-shadow:0 0 0 1px #E0A83C inset, 0 0 12px rgba(224,168,60,.5)}
html[data-mc-purse="emerald"] .purselink,
html[data-mc-purse="emerald"] .mc-purse{
  border-color:#3FBF7F; box-shadow:0 0 0 1px #3FBF7F inset, 0 0 12px rgba(63,191,127,.5)}
html[data-mc-purse="netherite"] .purselink,
html[data-mc-purse="netherite"] .mc-purse{
  border-color:#6B5F6B; background:#1B171B;
  box-shadow:0 0 0 1px #8C7A96 inset, 0 0 14px rgba(140,122,150,.55)}
html[data-mc-purse="netherite"] .purselink b,
html[data-mc-purse="netherite"] .mc-purse b{color:#D8CBE4}

/* ---------- the flourish over the chest ----------
   Decorative only: it is added after the chest opens and removed a couple of
   seconds later. `pointer-events:none` so it can never swallow a tap on the
   buttons underneath, and it is skipped entirely for anyone who has asked their
   machine for less movement. */
.mc-fx{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:2}
.mc-fx i{position:absolute; top:44%; width:8px; height:8px; opacity:0;
  animation:mc-fx-fall 1.5s ease-out forwards}
.mc-fx-sparkle i{width:5px; height:5px; border-radius:50%; background:#FFE9A8;
  box-shadow:0 0 6px #FFD166}
.mc-fx-confetti i:nth-child(3n){background:#E0A83C}
.mc-fx-confetti i:nth-child(3n+1){background:#3FBF7F}
.mc-fx-confetti i:nth-child(3n+2){background:#5AA9E6}
.mc-fx-firework i{width:6px; height:6px; border-radius:50%;
  background:#FFF; box-shadow:0 0 10px 2px #FF9247}
.mc-fx-firework i:nth-child(2n){box-shadow:0 0 10px 2px #CFBAFF}
.mc-fx-ore i{width:9px; height:9px; border-radius:2px; background:#5AA9E6}
.mc-fx-ore i:nth-child(4n){background:#3FBF7F}
.mc-fx-ore i:nth-child(4n+1){background:#E0A83C}
.mc-fx-ore i:nth-child(4n+2){background:#C4553F}
@keyframes mc-fx-fall{
  0%{opacity:0; transform:translate(0,0) scale(.4)}
  12%{opacity:1}
  100%{opacity:0; transform:translate(var(--mc-dx,0), -150px) scale(1) rotate(220deg)}
}
@media (prefers-reduced-motion: reduce){ .mc-fx{display:none} }

/* ---------- the rank he is wearing ---------- */
.mc-title{
  display:inline-block; margin:0; padding:3px 10px; border-radius:999px;
  border:1px solid var(--gold); color:var(--gold);
  font:800 10.5px var(--mono,monospace); letter-spacing:.14em; text-transform:uppercase;
  background:rgba(255,255,255,.05)}
/* MC-SKIN-CSS-END */
</style>

    { k: "coal",     name: "coal",     hex: "#2C2C30" },

    { k: "iron",     name: "iron",     hex: "#C6C2BC" },
    { k: "gold",     name: "gold",     hex: "#E4C04A" },
    { k: "redstone", name: "redstone", hex: "#B4262A" },
    { k: "lapis",    name: "lapis",    hex: "#2A5CB4" },
    { k: "diamond",  name: "diamond",  hex: "#40D5D1" },

  /* ---------- public ---------- */

      var portalShut = clean && !partialRun && isBossLevel && !ready;
      if (dragon) { S.dragon++; save(); }

      /* Coins, every run, from the very first one. Finishing at all is worth
         something — that is the floor, and it is deliberate: a child who had a
         bad round should still walk away holding more than he arrived with.
         Everything above the floor is earned. */
      var coins = 3;
      if (pct >= 75) coins += 3;
      if (pct >= 85) coins += 3;
      if (pct >= 95) coins += 4;
      if (pct >= 100) coins += 5;
      if (halves === 20) coins += 5;          // not a heart lost
      if (fixedHere) coins += 2 * fixedHere;  // fixing a miss pays, and it should
      if (dragon) coins += 40;
      if (partialRun) coins = Math.max(2, Math.round(coins / 2));
      S.coins += coins;
      S.earned += coins;
      save();
      drawCoins();

      /* What the run was worth at the rock face. Coal through gold repeat, so
         there is always something to dig; diamond is once per activity, so a
         pile of them needs breadth AND mastery; emerald comes only from the
         dragon. Nothing is mined at all until the tool set is complete. */
      var mined = [];
      function dig(k, n) {
        S.ore[k] = (S.ore[k] || 0) + n;
        mined.push({ k: k, n: n, name: ORE_BY[k].name, hex: ORE_BY[k].hex });
      }
      if (mineOpen()) {
        if (partialRun) {
          if (pct >= 100) dig("lapis", 1);            // every miss put right
        } else {
          if (pct >= 75) dig("coal", 1);
          if (pct >= 85) dig("copper", 1);
          if (pct >= 95) dig("iron", 1);
          if (pct >= 100) dig("gold", 1);
          if (pct >= 75 && halves === 20) dig("redstone", 1);
          if (clean && !S.gem[key]) { S.gem[key] = true; dig("diamond", 1); }
        }
        if (dragon) dig("emerald", 1);
        if (mined.length) save();
      }

      var tier;
      if (partialRun)   tier = ["CORRECTIONS", "You went back and fixed them. That is the part that sticks."];
      else if (dragon)  tier = ["DRAGON SLAIN", "Perfect. Not one miss, not one heart."];
      else if (clean)   tier = ["NETHERITE", "Every single one right."];
      else if (pct >= 90) tier = ["DIAMOND", "So close to flawless."];
      else if (pct >= 75) tier = ["IRON", "Solid work \u2014 this one is holding."];
      else if (pct >= 50) tier = ["STONE", "You got through it. Now you know where to dig."];
      else                tier = ["WOOD", "You finished it, and that is where everyone starts."];

      /* Badges stack. They reward things accuracy alone does not see. */
      var badges = [];
      if (fixedHere)
        badges.push(fixedHere === 1 ? "TURNED ONE AROUND" : "TURNED " + fixedHere + " AROUND");
      if (!partialRun && prev != null && pct > prev)
        badges.push("NEW BEST \u2014 BEAT " + prev + "%");
      if (!partialRun && (prev == null || prev < 75) && pct >= 75)
        badges.push("FIRST CLEAR");
      if (halves > 0 && halves <= 4 && pct >= 50)
        badges.push("STUCK IT OUT");

      var bea = null;
      if (mineOpen()) {
        bea = { lit: beaconLit(), need: [] };
        for (var bi = 0; bi < BEACON.length; bi++)
          bea.need.push({ k: BEACON[bi], have: oreCount(BEACON[bi]),
                          blocks: blocks(BEACON[bi]), name: ORE_BY[BEACON[bi]].name,
                          hex: ORE_BY[BEACON[bi]].hex });
      }

      return {
        mined: mined, beacon: bea, portalShut: portalShut,
        toolsLeft: (8 - unlocked().count) + (S.tool9 ? 0 : 1),
        mineOpen: mineOpen(), dragons: S.dragon,
        tool: got,
        toolName: got ? TOOLS[got - 1] : null,
        loot: halves >= 20 ? 4 : halves >= 15 ? 3 : halves >= 8 ? 2 : 1,
        hearts: halves / 2,
        fixed: fixedHere,
        partial: partialRun,
        tier: tier[0], blurb: tier[1], badges: badges,
        boss: dragon
      };
    },

    /* Paints chest-closed, then opens it on tap or after a beat. */
    chest: function (host, pct, opts) {
      if (!host) return null;
      var r = MC.clear(opts.id, pct, opts);
      var box = document.createElement("div");
      box.className = "mc-chest";
      box.innerHTML = '<img class="mc-lid mc-shut" alt="Closed chest" src="' + url("chest-closed") + '">' +
                      '<div class="mc-loot"></div>' +
                      '<div class="mc-tier"></div>' +
                      '<div class="mc-cap">Tap the chest</div>';
      host.insertBefore(box, host.firstChild);
      var lid = box.querySelector(".mc-lid"),
          loot = box.querySelector(".mc-loot"),
          tierEl = box.querySelector(".mc-tier"),
          cap = box.querySelector(".mc-cap"),
          opened = false;

      function open() {
        if (opened) return;
        opened = true;
        lid.classList.remove("mc-shut");
        lid.src = url("chest-open");
        burst(box);   /* whatever he has on: sparkle by default, bought if bought */
        lid.alt = "Open chest";
        lid.style.cursor = "default";
        var html = "", i;
        for (i = 1; i <= r.loot; i++) html += '<img alt="" src="' + url("win-" + i) + '">';
        loot.innerHTML = html;
        tierEl.textContent = r.tier;
        tierEl.setAttribute("data-t", r.tier.split(" ")[0].toLowerCase());
        cap.textContent = r.blurb;
        if (r.badges.length) {
          box.insertAdjacentHTML("beforeend", '<div class="mc-badges">' +
            r.badges.map(function (b) { return '<span class="mc-badge">' + b + "</span>"; })
              .join("") + "</div>");
        }
        if (r.tool) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-earned"><img alt="" src="' + url("tool-" + r.tool) + '">' +
            "<span>NEW &middot; " + r.toolName.toUpperCase() + "</span></div>");
        }
        if (r.mined && r.mined.length) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-haul"><span class="mc-haullab">MINED</span>' +
            r.mined.map(function (m) { return oreChip(m.k, "+" + m.n); }).join("") +
            "</div>");
        }
        if (r.portalShut) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-shutportal"><img class="mc-portal" alt="" src="' + url("portal") +
            '" onerror="this.remove()">THE PORTAL WILL NOT OPEN<small>A perfect run \u2014 ' +
            'but the End stays shut until all nine tools are yours. ' +
            (r.toolsLeft === 1 ? "One to go." : r.toolsLeft + " to go.") + "</small></div>");
        }
        if (r.beacon) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-beacon' + (r.beacon.lit ? " mc-lit" : "") + '">' +
            '<span class="mc-haullab">' + (r.beacon.lit ? "BEACON LIT" : "BEACON") + "</span>" +
            r.beacon.need.map(function (b) { return blockChip(b); }).join("") +
            "<small>" + (r.beacon.lit
              ? "Iron, gold, diamond and emerald, a block of each. That is the whole pyramid."
              : "Nine of a mineral makes a block. Four blocks light the beacon.") +
            "</small></div>");
        }
        if (!r.boss && r.dragons > 0 && r.mineOpen) {
          box.insertAdjacentHTML("beforeend",
            '<div class="mc-egg"><img alt="" src="' + url("dragon-egg") +
            '" onerror="this.remove()"><span>' +
            (r.dragons === 1 ? "One dragon down" : r.dragons + " dragons down") +
            "</span></div>");
        }
        if (r.boss) {
          box.insertAdjacentHTML("beforeend", HAS_BOSS
            ? '<img class="mc-boss" alt="Ender dragon defeated" src="' + url("boss-defeated") + '">'
            : '<div class="mc-bossfall">DRAGON SLAIN<small>Perfect run \u2014 no misses, no hearts lost</small></div>');
        }
      }
      lid.addEventListener("click", open);
      setTimeout(open, 2600);                // opens itself if he doesn't tap
      return r;
    },

    /* Best score per activity for THIS app, keyed by bare id — lets an app's
       level picker show scores that survive a reload. The apps each kept their
       own in-memory `best` object, which forgot everything on refresh. */
    bests: function () {
      var out = {}, pre = cfg.app + ":", k;
      for (k in S.cleared) if (k.indexOf(pre) === 0) out[k.slice(pre.length)] = S.cleared[k];
      return out;
    },

    /* A strip of level chips, each showing whether it has been cleared.
       Reusable: any app with several parallel levels calls this rather than
       rolling its own, so history, and anything added later, look the same.

         MC.picker(hostEl, [{id:"set0", label:"1"}, ...], currentId, onPick)

       Chips colour themselves from MC.bests(): green cleared, amber attempted,
       plain untouched. Re-call it to repaint after a score changes. */
    picker: function (host, items, current, onPick) {
      if (!host) return;
      var best = MC.bests();
      host.className = "mc-picker";
      host.innerHTML = items.map(function (it) {
        var b = best[it.id];
        var cls = b == null ? "" : (b >= 75 ? " mc-cleared" : " mc-tried");
        if (it.id === current) cls += " mc-now";
        return '<button type="button" class="mc-chip' + cls + '" data-id="' + it.id +
               '" aria-pressed="' + (it.id === current) + '"' +
               ' title="' + (b == null ? "not tried yet" : "best " + b + "%") + '">' +
               '<span class="mc-chip-l">' + it.label + "</span>" +
               '<span class="mc-chip-s">' + (b == null ? "&mdash;" : b + "%") + "</span>" +
               "</button>";
      }).join("");
      var bs = host.querySelectorAll(".mc-chip");
      for (var i = 0; i < bs.length; i++) {
        bs[i].addEventListener("click", function () {
          onPick(this.getAttribute("data-id"));
        });
      }
    },

    state: function () {
      var u = unlocked();
      return {
        tools: u, toolNames: TOOLS,
        ore: JSON.parse(JSON.stringify(S.ore)), oreKinds: ORE,
        mineOpen: mineOpen(), dragons: S.dragon,
        coins: S.coins, earned: S.earned,
        owned: JSON.parse(JSON.stringify(S.owned)),
        equip: JSON.parse(JSON.stringify(S.equip)),
        gate: TOOL_GATE, elytraNeeds: ELYTRA_SUBJECTS,
        subjectsCleared: subjectsCleared(),
        gems: JSON.parse(JSON.stringify(S.gem)),
        beacon: { needs: BEACON, lit: beaconLit(),
                  blocks: BEACON.map(function (k) { return blocks(k); }) },
        cleared: JSON.parse(JSON.stringify(S.cleared)),
        misses: JSON.parse(JSON.stringify(S.misses)),
        runs: JSON.parse(JSON.stringify(S.runs)),
        url: url
      };
    },

    /* Every attempt at one activity, oldest first. The hub's report reads this;
       apps do not need it. */
    runs: function (id) {
      var key = cfg.app + ":" + id;
      return (S.runs[key] || []).slice();
    },

    /* The wording to ask a question in.

       An item may carry `qv`, a few phrasings of the same question. One is
       chosen per run, so a second attempt at the same set does not read like a
       memory test of the first — but it is fixed for the length of that run, so
       the review screen shows the wording he was actually asked rather than a
       third one. Items without `qv` just return `q`.

       Options are already re-shuffled on every render; this is the same idea
       applied to the stem. */
    ask: function (it) {
      if (!it) return "";
      var v = it.qv;
      if (!v || !v.length) return it.q;
      if (it.__mcq === undefined) it.__mcq = ++askSeq;
      if (askPick[it.__mcq] === undefined)
        askPick[it.__mcq] = (Math.random() * v.length) | 0;
      return v[askPick[it.__mcq]];
    },

    /* Sound off/on. Kept in the same saved state as everything else, so the
       choice holds across every app and survives a reload. Call with no
       argument to read it. */
    mute: function (on) {
      if (on === undefined) return !!S.mute;
      S.mute = !!on;
      save();
      drawMute();
      return S.mute;
    },

    /* ---------- the shop ----------
       The catalogue lives in store/index.html, because what is for sale is
       content and this is the engine. All the engine owns is the money and the
       fact of ownership. */

    earned: function () { return S.earned; },

    owns: function (id) { return !!S.owned[id]; },

    /* Buys once and keeps it. Refuses rather than going overdrawn, and refuses
       a second purchase of something already owned, so a double tap on a slow
       connection cannot charge twice. */
    buy: function (id, cost) {
      cost = Math.max(0, Math.round(Number(cost) || 0));
      if (!id || S.owned[id]) return false;
      if (S.coins < cost) return false;
      S.coins -= cost;
      S.owned[id] = true;
      save();
      drawCoins();
      return true;
    },

    /* Wearing costs nothing and can be undone. Passing null takes the slot back
       to its default, so nothing bought can ever strand him in a look he has
       gone off. Refuses to equip something not owned. */
    equip: function (slot, id) {
      if (!slot) return false;
      if (id && !S.owned[id]) return false;
      if (id) S.equip[slot] = id; else delete S.equip[slot];
      save();
      skin();
      return true;
    },

    equipped: function (slot) { return S.equip[slot] || null; },

    reset: function () {
      S = { cleared: {}, misses: {}, tool9: false, ore: {}, gem: {}, dragon: 0,
            runs: {}, coins: 0, earned: 0, owned: {}, equip: {},
            mute: S.mute };  // muting is a preference, not progress
      save(); drawBar(); drawCoins(); skin();
    },
    _relift: lift
  };

  skin();

  window.MC = MC;
})();
</script>

<script>/* MATH-SKILLS: inlined by build_theme.py, do not hand-edit */
/* Saxon Course 2 — practice generators, one per lesson skill.
 *
 * The book numbers every written-practice problem with the lesson it reviews:
 * "* 14. (3) w - 98 = 432" means problem 14 practises Lesson 3. That tag is the
 * hinge of the whole thing — it turns "I missed number 14" into "he needs the
 * Lesson 3 skill", which is something a program can act on.
 *
 * So a generator here is keyed by the lesson that TEACHES a skill, not by the
 * lesson whose homework it turned up in. gen(3) makes unknown-number questions
 * whether they were missed on Lesson 7's homework or Lesson 40's.
 *
 * Every generator returns a question with fresh numbers each call. Nothing is
 * ever a repeat of the homework, which is the point: it is practice on the
 * skill, not a second attempt at the same problem. It also keeps the book out
 * of the repo, since none of its problems are reproduced anywhere.
 *
 * Each returns { q, opts, a, why, cite, ex, skill } where `ex` names a worked
 * example the app can open, and `a` indexes the correct option AFTER shuffling.
 *
 * Lessons 1-10 are built. Everything past that returns null, and the app says
 * so out loud rather than quietly producing nothing.
 */
(function (root) {
  "use strict";

  /* ---------- dice ---------- */
  function rnd(n) { return Math.floor(Math.random() * n); }
  function between(lo, hi) { return lo + rnd(hi - lo + 1); }
  function pick(a) { return a[rnd(a.length)]; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* Four options from one right answer and a list of wrong ones, shuffled, with
     the correct index reported back. Duplicates are dropped before the count is
     checked, because a distractor that happens to equal the answer is the one
     bug in a generated question that a child cannot argue with. */
  function opts(right, wrongs) {
    var seen = {}, out = [];
    seen[String(right)] = true;
    for (var i = 0; i < wrongs.length && out.length < 3; i++) {
      var w = String(wrongs[i]);
      if (!seen[w]) { seen[w] = true; out.push(wrongs[i]); }

    return { opts: all, a: all.indexOf(String(right)) };

     Retrying with new numbers is cheaper and clearer than contorting the
     distractor rules to guarantee distinctness for every input. */
  function tries(fn) {

  function L1() {

                 why: m + " × " + n + " = " + commas(p) + ". Multiply by the ones digit, then by the tens digit shifted one place left, then add the two rows.",

<script>
/* Saxon Course 2 practice.
 *
 * The other apps hold a fixed set of questions written in advance. This one
 * holds none: it holds the book's index of which lesson each written-practice
 * problem reviews, a generator per skill, and the arithmetic to put the two
 * together. You tick the problems that came back wrong and it builds practice
 * on those skills with different numbers.
 *
 * That inversion is the point. A night's homework is thirty problems drawn from
 * everything taught so far, so "which ones did you miss" is a far better
 * question than any set of questions written a week earlier could be.
 *
 * What is saved is the ticks, not the questions — so opening the same lesson
 * again rebuilds it with new numbers rather than replaying the same sheet.
 */
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* Which problems were ticked, per lesson. Questions are never saved: the whole
   point is that they come out different next time. */
const KEY = "math.sets.v1";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} }
let SAVED = load();

/* A problem is practisable when at least one of the lessons it reviews has a
   generator. An untagged problem — 25 of the book's 3,598 could not be read —
   is treated as practising its own lesson, which is the safe guess. */
function skillsFor(lesson, i){
  const t = MATHMAP.tags(lesson);
  const tag = t[i] || [];
  const raw = tag.length ? tag : [lesson];
  return raw.filter(s => MATH.has(s));
}
function ready(lesson){
  const n = MATHMAP.count(lesson);
  let ok = 0;
  for (let i = 0; i < n; i++) if (skillsFor(lesson, i).length) ok++;
  return { of: n, ok };
}

/* ---------------------------------------------------------------- lessons */
function home(){
  show("home");
  const out = [];
  for (let d = 0; d < 12; d++){
    const lo = d * 10 + 1, hi = lo + 9;
    const rows = [];
    let live = 0;
    for (let L = lo; L <= hi; L++){
      const r = ready(L);
      const has = SAVED[L];
      if (r.ok) live++;
      const name = MATH.has(L) ? MATH.name(L) : null;
      const sub = r.ok === 0
        ? "No practice built for these skills yet"
        : (r.ok < r.of ? r.ok + " of " + r.of + " problems ready" : r.of + " problems")
          + (has ? " · you have a set saved" : "");
      rows.push(`<li><button class="lrow${has?" saved":""}" data-l="${L}"${r.ok?"":" disabled"}>
        <span class="lnum">${L}</span>
        <span class="lwhat"><b>${esc(name || ("Lesson " + L))}</b><small>${esc(sub)}</small></span>
        <span class="lgo">${r.ok ? (has ? "Open &rsaquo;" : "Pick problems &rsaquo;") : "Soon"}</span>
      </button></li>`);
    }
    out.push(`<details class="decade"${lo === 1 ? " open" : ""}>
      <summary>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <h2>Lessons ${lo}&ndash;${hi}</h2>
        <span class="tally">${live} of 10 ready</span>
      </summary>
      <ul class="lessons">${rows.join("")}</ul>
    </details>`);
  }
  $("decades").innerHTML = out.join("");
  [...document.querySelectorAll(".lrow")].forEach(b=>{
    if(!b.disabled) b.onclick = ()=>pick(+b.dataset.l);
  });

  const built = MATH.built;
  $("foot").innerHTML =
    "Practice is built for the skills taught in lessons " + built[0] + "&ndash;" +
    built[built.length-1] + ". A later lesson opens as soon as the skills its problems " +
    "review are built, so lessons past " + built[built.length-1] + " will fill in over time.<br>" +
    "Questions are written for this review and use different numbers from the homework. " +
    "Nothing from the textbook is reproduced here; skills and lesson numbers follow " +
    "Saxon Math, Course 2 (Stephen Hake).";
}

/* ---------------------------------------------------------------- picker */
let PICK = {};      // problem number -> how many questions
let LESSON = 0;

function pick(L){
  LESSON = L;
  PICK = Object.assign({}, (SAVED[L] && SAVED[L].picks) || {});
  drawPicker();
}

function drawPicker(){
  const n = MATHMAP.count(LESSON);
  const cells = [];
  for (let i = 1; i <= n; i++){
    const sk = skillsFor(LESSON, i - 1);
    const on = PICK[i] > 0;
    const label = sk.length ? sk.map(s=>MATH.name(s)).join(" + ") : "not built yet";
    cells.push(`<label class="pk${sk.length ? (on ? " on" : "") : " off"}" data-n="${i}">
      <input type="checkbox" ${on?"checked":""} ${sk.length?"":"disabled"}>
      <span class="n">${i}</span>
      <span class="s" title="${esc(label)}">${esc(label)}</span>
      <span class="howmany">${[2,3,4].map(k=>
        `<button type="button" data-k="${k}" class="${(PICK[i]||2)===k?"sel":""}">${k}</button>`).join("")}</span>
    </label>`);
  }
  const total = Object.values(PICK).reduce((a,b)=>a+b,0);
  $("picker").innerHTML = `<div class="scrim" id="scrim">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Choose problems">
      <div class="shead">
        <div>
          <h2>Lesson ${LESSON} &mdash; which problems did you miss?</h2>
          <p>Written practice, page ${MATHMAP.page(LESSON)}. Tick the ones that came
             back wrong, then say how many of each you want &mdash; two, three or four.</p>
        </div>
        <button class="sx" id="sclose" aria-label="Close">&times;</button>
      </div>
      <div class="stools">
        <button class="btn o" id="sclear">Clear all</button>
        <button class="btn o" id="slast" ${SAVED[LESSON]?"":"disabled"}>Last time's picks</button>
      </div>
      <div class="grid" id="pkgrid">${cells.join("")}</div>
      <div class="sfoot">
        <span class="count" id="pkcount">${total ? total + " questions" : "Nothing picked yet"}</span>
        <button class="btn" id="smake" ${total?"":"disabled"}>Make my practice</button>
      </div>
    </div></div>`;

  [...document.querySelectorAll(".pk")].forEach(el=>{
    const num = +el.dataset.n;
    const box = el.querySelector("input");
    if(box && !box.disabled){
      box.onchange = ()=>{ if(box.checked) PICK[num] = PICK[num] || 2; else delete PICK[num]; drawPicker(); };
    }
    [...el.querySelectorAll(".howmany button")].forEach(b=>{
      b.onclick = e=>{
        e.preventDefault(); e.stopPropagation();
        PICK[num] = +b.dataset.k;      /* choosing a count also ticks it */
        drawPicker();
      };
    });
  });
  $("sclose").onclick = shutPicker;
  $("scrim").onclick = e=>{ if(e.target === $("scrim")) shutPicker(); };
  $("sclear").onclick = ()=>{ PICK = {}; drawPicker(); };
  $("slast").onclick = ()=>{ PICK = Object.assign({}, SAVED[LESSON].picks); drawPicker(); };
  $("smake").onclick = ()=>make();
}
function shutPicker(){ $("picker").innerHTML = ""; }

/* ---------------------------------------------------------------- the run */
let Q = [], idx = 0, tries = 0, picked = null, shown = false, log = [], state = [], forceFin = false;

function make(only){
  /* `only` is a map of problem number -> how many, passed by "practise just
     those". It is guarded because assigning this function straight to an
     onclick hands it the MouseEvent instead — which is truthy, so the set gets
     built from an event object, comes out empty, and the button silently does
     nothing. That is exactly what happened the first time this shipped. */
  const use = (only && typeof only === "object" && !only.type) ? only : PICK;
  const out = [];
  Object.keys(use).map(Number).sort((a,b)=>a-b).forEach(nu=>{
    const sk = skillsFor(LESSON, nu - 1);
    MATH.forProblem(sk, use[nu]).forEach(q=>{ q.from = nu; out.push(q); });
  });
  if(!out.length) return;
  if(!only){
    SAVED[LESSON] = { picks: Object.assign({}, PICK) };
    save(SAVED);
  }
  shutPicker();
  Q = out; idx = 0; log = []; state = []; forceFin = false;
  MC.begin({ id: "l" + LESSON, total: Q.length });
  render();
  show("play");
}

function show(w){
  ["home","play","done"].forEach(x=>$(x).classList.toggle("hide", x !== w));
  $("tolessons").classList.toggle("hide", w === "home");
  window.scrollTo(0,0);
}

function render(){
  tries = 0; picked = null; shown = false;
  const it = Q[idx];
  $("pname").textContent = "Lesson " + LESSON + " practice";
  $("dots").innerHTML = Q.map((_,i)=>
    `<span class="dot ${i<idx?"done":i===idx?"now":""}"></span>`).join("");
  $("card").innerHTML =
    `<div class="qnum">Question ${idx+1} of ${Q.length}</div>
     <div class="qsrc">From problem ${it.from} &middot; ${esc(MATH.name(it.skill))}</div>
     <div class="q">${it.q}</div>
     <div class="opts" id="opts"></div><div class="act" id="act"></div><div id="fb"></div>`;
  $("opts").innerHTML = it.opts.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("");
  $("act").innerHTML = `<button class="btn" id="go" disabled>Check my answer</button>`;
  [...document.querySelectorAll(".opt")].forEach(b=>b.onclick=()=>{
    if($("go").dataset.done) return;
    [...document.querySelectorAll(".opt")].forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); picked = +b.dataset.i; $("go").disabled = false;
  });
  $("go").onclick = check;
  navBar();
  restore();
}

function check(){
  const it = Q[idx];
  const right = picked === it.a;
  tries++;
  const key = "l" + LESSON + ":p" + it.from + ":" + it.skill;
  if(right){
    MC[tries === 1 ? "right" : "credit"](key);
    document.querySelectorAll(".opt")[picked].classList.add("right");
    finishQ(true);
  } else {
    MC.wrong(key);
    document.querySelectorAll(".opt")[picked].classList.add("wrong");
    miss(it);
  }
}

function finishQ(won){
  const it = Q[idx];
  $("go").dataset.done = "1";
  $("go").remove();
  log[idx] = { won: won, tries: tries };
  $("fb").innerHTML =
    `<div class="fb ${won?"yes":"no"}">${won
      ? "<strong>That is right.</strong> " : "<strong>Here it is.</strong> "}${esc(it.why)}
      <cite>${esc(it.cite)}</cite></div>`;
  keep();
  navBar();
}

function miss(it){
  $("fb").innerHTML =
    `<div class="fb no"><strong>Not that one.</strong> ` +
    (tries === 1 ? "Have another go — the worked example is there if you want it."
                 : "Have another look.") + `</div>`;
  if(!$("readbtn")){
    $("act").insertAdjacentHTML("afterbegin",
      `<button class="btn o" id="readbtn">Show me a worked example</button>`);
    $("readbtn").onclick = ()=>openEx(it.ex, it.hi);
  }
  if(tries >= 3 && !$("reveal")){
    $("act").insertAdjacentHTML("afterbegin",
      `<button class="btn o" id="reveal">Show me the answer</button>`);
    $("reveal").onclick = ()=>{
      shown = true;
      document.querySelectorAll(".opt")[it.a].classList.add("right");
      finishQ(false);
    };
  }
  $("go").disabled = true;
  keep();
}

/* Remembering a question, so Back does not wipe what was done. */
function keep(){
  state[idx] = { tries: tries, shown: shown, picked: picked,
                 html: $("fb").innerHTML, done: !!(log[idx]) };
}
function restore(){
  const st = state[idx];
  if(!st) return;                       /* never answered — leave it blank */
  tries = st.tries; shown = st.shown; picked = st.picked;
  if(st.picked != null){
    const it = Q[idx];
    const el = document.querySelectorAll(".opt")[st.picked];
    if(el) el.classList.add(st.picked === it.a ? "right" : "wrong");
    if(st.done && st.picked !== it.a) document.querySelectorAll(".opt")[it.a].classList.add("right");
  }
  $("fb").innerHTML = st.html || "";
  if(st.done && $("go")) { $("go").dataset.done = "1"; $("go").remove(); }
  navBar();
}

function navBar(){
  const last = idx === Q.length - 1;
  const answered = !!log[idx];
  $("nav").innerHTML =
    `<button class="navb" id="back" ${idx?"":"disabled"}>&lsaquo; Back</button>
     <span class="navpos">${idx+1} / ${Q.length}</span>
     <button class="navb" id="next">${last ? "Finish &rsaquo;" : (answered ? "Next &rsaquo;" : "Skip &rsaquo;")}</button>`;
  $("back").onclick = ()=>{ if(idx){ keep(); idx--; render(); } };
  $("next").onclick = ()=>{ keep(); if(last) finish(); else { idx++; render(); } };
}

function unanswered(){
  const out = [];
  for(let i = 0; i < Q.length; i++) if(!log[i]) out.push(i);
  return out;
}

function finish(){
  const left = unanswered();
  if(left.length && !forceFin){
    $("skipnote").innerHTML =
      `<div class="skipnote"><strong>${left.length === 1 ? "One question is"
        : left.length + " questions are"} still blank.</strong>
       ${left.length === 1 ? "It is" : "They are"} number ${left.map(i=>i+1).join(", ")}.
       Nothing is lost by finishing — but they are quick, and they count.
       <div class="act">
         <button class="btn" id="goback">Go to the first blank one</button>
         <button class="btn o" id="anyway">Finish anyway</button>
       </div></div>`;
    $("goback").onclick = ()=>{ $("skipnote").innerHTML = ""; idx = left[0]; render(); };
    $("anyway").onclick = ()=>{ $("skipnote").innerHTML = ""; forceFin = true; finish(); };
    return;
  }
  $("skipnote").innerHTML = "";
  const first = log.filter(r => r && r.won && r.tries === 1).length;
  const att = log.reduce((n,r)=> n + (r ? r.tries : 0), 0);
  const pct = Math.round(first / Q.length * 100);
  const missed = {};
  Q.forEach((q,i)=>{ if(!log[i] || !log[i].won || log[i].tries > 1) missed[q.from] = SAVED[LESSON] &&
    SAVED[LESSON].picks[q.from] || 2; });
  const miss = Object.keys(missed).map(Number).sort((a,b)=>a-b);

  const band = pct >= 95 ? ["Nailed it","#2F8F76"] : pct >= 85 ? ["Strong","#3D82B8"]
             : pct >= 70 ? ["Getting there","#E0A83C"] : ["Worth another go","#C4553F"];
  $("dtag").textContent = "LESSON " + LESSON + " PRACTICE";
  $("scorebox").innerHTML = `
    <div class="ring" style="color:${band[1]}">${pct}%</div>
    <div class="band" style="color:${band[1]}">${band[0]}</div>
    <div class="stats">
      <div class="stat"><b>${first} / ${Q.length}</b><span>First try</span></div>
      <div class="stat"><b>${att}</b><span>Total tries</span></div>
    </div>
    ${miss.length ? `<div class="missed"><strong>Still shaky:</strong> problem${miss.length>1?"s":""}
      ${miss.join(", ")} from the homework. Another round on just those is the fastest
      way to close it.</div>` : `<div class="missed">Every question first time. Nothing
      left over from this lot.</div>`}
    <div class="act">
      ${miss.length ? `<button class="btn" id="again">Practise just those ${miss.length}</button>` : ""}
      <button class="btn ${miss.length?"o":""}" id="same">New questions, same problems</button>
      <button class="btn o" id="change">Change which problems</button>
      <button class="btn o" id="out">All lessons</button>
    </div>`;
  MC.chest($("scorebox"), pct, { id: "l" + LESSON });
  if($("again")) $("again").onclick = ()=>{
    const only = {}; miss.forEach(n=>{ only[n] = missed[n]; }); make(only);
  };
  $("same").onclick = ()=>make();
  $("change").onclick = ()=>{ show("home"); pick(LESSON); };
  $("out").onclick = ()=>{ SAVED = load(); home(); };
  show("done");
}

/* ---------------------------------------------------------------- example */
/* Marks the line that answers the question. Opening the example without
   pointing at anything just moves the problem: a child who could not answer it
   is no better placed to find the answer in four paragraphs of method. The text
   is escaped first and the needle escaped the same way, so the match happens on
   the escaped string and no markup can be injected. */
function markUp(text, hi){
  let out = esc(text);
  const list = Array.isArray(hi) ? hi : (hi ? [hi] : []);
  list.forEach(h=>{
    const n = esc(h);
    if(n && out.indexOf(n) !== -1) out = out.split(n).join('<mark class="hl">' + n + '</mark>');
  });
  return out;
}
function openEx(key, hi){
  const P = MATHEX[key];
  if(!P) return;
  const box = $("readbox");
  box.innerHTML = `<div class="readinner" role="dialog" aria-modal="true" aria-label="Worked example">
      <div class="readhead">
        <div><div class="readtitle">${esc(P.title)}</div>
             <div class="readcite">${esc(P.cite)}</div></div>
        <button class="readx" id="readx" aria-label="Close">&times;</button>
      </div>
      <div class="readbody">${P.text.map(t=>`<p>${markUp(t, hi)}</p>`).join("")}</div>
      ${(P.vocab && P.vocab.length) ? `<div class="readvocab">
        <div class="vlab">The way the lesson puts it</div>
        ${P.vocab.map(v=>`<p><b>${esc(v[0])}</b> <i>${esc(v[1])}</i> ${markUp(v[2], hi)}</p>`).join("")}
      </div>` : ""}
      ${P.book ? `<p class="readbook">${esc(P.book)}</p>` : ""}
      <button class="btn" id="readdone">Got it &mdash; back to the question</button>
    </div>`;
  box.hidden = false;
  document.body.style.overflow = "hidden";
  const first = box.querySelector("mark.hl");
  if(first) first.scrollIntoView({block:"center"});
  const shut = ()=>{ box.hidden = true; document.body.style.overflow = ""; };
  $("readx").onclick = shut;
  $("readdone").onclick = shut;
  box.onclick = e=>{ if(e.target === box) shut(); };
  document.addEventListener("keydown", function esc2(e){
    if(e.key === "Escape"){ shut(); document.removeEventListener("keydown", esc2); }
  });
  $("readdone").focus();
}

$("tolessons").onclick = e=>{ e.preventDefault(); SAVED = load(); home(); };
home();
</script>
